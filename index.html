َكۡتُبُ يَاءٌ ضُمَّ مَعْ فَتْحِ ضَمِّهِ","وَقَتۡلُ ارْفَعُوا مَعْ يَا يَقُولُ فَيَكْمُلَا"],["وَبِٱلزُّبُرِ الشَّامِي كَذَا رَسْمُهُمْ، وَبِٱلۡـ","ـكِتَٰبِ هِشَامٌ وَاكْشِفِ الرَّسْمَ مُجْمِلَا"],["صَفَا حَقُّ غَيْبٍ يَكۡتُمُونَ يُبَيِّنُنۡـ","ـنَ، لَا يَحۡسِبَنَّ الغَيْبُ كَيْفَ سَمَا اعْتَلَى"],["وَحَقّاً بِضَمِّ البَا فَلَا يَحۡسِبُنَّهُمۡ","وَغَيْبٍ وَفِيهِ العَطْفُ أَوْ جَاءَ مُبْدَلَا"],["هُنَا قَٰتَلُواْ أَخِّرْ شِفَاءً وَبَعْدُ فِي","بَرَاءَةَ أَخِّرْ يَقۡتُلُونَ شَمَرْدَلَا"],["وَيَاءَاتُهَا: وَجۡهِي وَإِنِّي كِلَاهُمَا","وَمِنِّيَ وَٱجۡعَل لِّى وَأَنصَارِيَ المِلّاَ"],["وَكُوفِيُّهُمْ تَسَّآءَلُونَ مُخَفَّفاً","وَحَمْزَةُ وَٱلۡأَرۡحَامِ بِالخَفْضِ جَمَّلَا"],["وَقَصْرُ قِيَٰمࣰا عَمَّ، يَصۡلَوۡنَ ضُمَّ كَمْ","صَفَا، نَافِعٌ بِالرَّفْعِ وَٰحِدَةࣱ جَلاَ"],["وَيُوصَيٰ بِفَتْحِ الصَّادِ صَحَّ كَمَا دَنَا","وَوَافَقَ حَفْصٌ فِي الأَخِيرِ مُحَمَّلَا"],["وَفِي أُمِّ مَعْ فِي أُمِّهَا، فَلِأُمِّهِ","لَدَى الوَصْلِ ضَمُّ الهَمْزِ بِالكَسْرِ شَمْلَلَا"],["وَفِي أُمَّهَٰتِ النَّحْلِ وَالنُّورِ وَالزُّمَرْ","مَعَ النَّجْمِ شَافٍ وَاكْسِرِ المِيمَ فَيْصَلَا"],["وَنُدۡخِلۡهُ نُونٌ مَعْ طَلاَقٍ وَفَوْقُ مَعْ","نُكَفِّرۡ نُعَذِّبۡ مَعْهُ فِي الفَتْحِ إِذْ كَلَا"],["وَهَـٰذَٰنِ هَـٰتَيۡنِ ٱلَّذَانِ ٱلَّذَيۡنِ قُلْ","تُشَدَّدُ لِلْمَكِّي، فَذَٰنِكَ دُمْ حُلَى"],["وَضَمَّ هُنَا كُرۡهࣰا وَعِنْدَ بَرَاءَةٍ","شِهَابٌ وَفِي الأَحْقَافِ ثُبِّتَ مَعْقِلَا"],["وَفِي الكُلِّ فَافْتَحْ يَا مُبَيِّنَةࣲ دَنَا","صَحِيحاً وَكَسْرُ الجَمْعِ كَمْ شَرَفاً عَلَا"],["وَفِي مُحۡصَنَٰتٍ فَاكْسِرِ الصَّادَ رَاوِياً","وَفِي ٱلۡمُحۡصَنَٰتِ اكْسِرْ لَهُ غَيْرَ أَوَّلَا"],["وَضَمٌّ وَكَسْرٌ فِي أُحِلَّ صِحَابُهُ","وُجُوهٌ وَفِي أُحۡصِنَّ عَنْ نَفَرِ العُلَى"],["مَعَ الحَجِّ ضَمُّوا مُدۡخَلࣰا خُصَّهُ، وَسَلۡ","فَسَلۡ حَرَّكُوا بِالنَّقْلِ رَاشِدُهُ دَلَا"],["وَفِي عَـٰقَدَتۡ قَصْرٌ ثَوَى، وَمَعَ الحَدِيـ","ـدِ فَتْحُ سُكُونِ ٱلۡبُخۡلِ وَالضَّمِّ شَمْلَلَا"],["وَفِي حَسَنَهۡ حِرْمِيُّ رَفْعٍ، وَضَمُّهُمْ","تُسَوَّىٰ نَمَى حَقّاً وَعَمَّ مُثَقَّلاَ"],["وَلَٰمَسۡتُمُ اقْصُرْ تَحْتَهَا وَبِهَا شَفَا","وَرَفْعُ قَلِيلࣱ مِّنۡهُمُ النَّصْبَ كُلِّلَا"],["وَأَنِّثْ تَكُنۡ عَنْ دَارِمٍ، يُظۡلَمُونَ غَيْـ","ـبُ شُهْدٍ دَنَا، إِدْغَامُ بَيَّتَ فِي حُلَى"],["وَإِشْمَامُ صَادٍ سَاكِنٍ قَبْلَ دَالِهِ","كَ:أَصۡدَقُ زَاياً شَاعَ وَارْتَاحَ أَشْمُلَا"],["وَفِيهَا وَتَحْتَ الفَتْحِ قُلْ فَتَثَبَّتُواْ","مِنَ الثَّبْتِ وَالغَيْرُ البَيَانَ تَبَدَّلَا"],["وَعَمَّ فَتىً قَصْرُ ٱلسَّلَٰمِ مُؤَخَّراً","وَغَيۡرُ أُوْلِى بِالرَّفْعِ فِي حَقِّ نَهْشَلَا"],["وَيُؤۡتِيهِ بِاليَا فِي حِمَاهُ وَضَمُّ يَدۡ","خُلُونَ وَفَتْحُ الضَّمِّ حَقُّ صِرىً حَلَا"],["وَفِي مَرْيَمٍ وَالطَّوْلِ الَاوَّلُ عَنْهُمُ","وَفِي الثَّانِ دُمْ صَفْواً وَفِي فَاطِرٍ حَلَا"],["وَيَصَّٰلَحَا فَاضْمُمْ وَسَكِّنْ مُخَفِّفاً","مَعَ القَصْرِ وَاكْسِرْ لَامَهُ ثَابِتاً تَلَا"],["وَتَلۡوُۥاْ بِحَذْفِ الوَاوِ الُاولَى وَلَامَهُ","فَضُمَّ سُكُوناً لَسْتَ فِيهِ مُجَهَّلَا"],["وَنُزِّلَ فَتْحُ الضَّمِّ وَالكَسْرِ حِصْنُهُ","وَأَنزَلَ عَنْهُمْ، عَاصِمٌ بَعْدُ نَزَّلَا"],["وَيَا سَوۡفَ يُؤۡتِيهِمۡ عَزِيزٌ، وَحَمْزَةٌ","سَيُؤۡتِيهِمُۥ، فِى ٱلدَّرۡكِ كُوفٍ تَحَمَّلَا"],["بِالِاسْكَانِ، تَعۡدُواْ سَكِّنُوهُ وَخَفِّفُوا","خُصُوصاً وَأَخْفَى العَيْنَ قَالُونُ مُسْهِلَا"],["وَفِي الأَنْبِيَا ضَمُّ ٱلزَّبُورِ وَهَهُنَا","زَبُورࣰا وَفِي الإِسْرَا لِحَمْزَةَ أُسْجِلاَ"],["وَسَكِّنْ مَعاً شَنۡـَٔانُ صَحَّا كِلاَهُمَا","وَفِي كَسْرِ إِن صَدُّوكُمُۥ حَامِدٌ دَلَا"],["مَعَ القَصْرِ شَدِّدْ يَاءَ قَٰسِيَةࣰ شَفَا","وَأَرۡجُلَكُمۡ بِالنَّصْبِ عَمَّ رِضاً عَلَا"],["وَفِي رُسۡلِنَا مَعْ رُسۡلِكُمۡ ثُمَّ رُسۡلِهِمۡ","وَفِي سُبۡلَنَا فِي الضَّمِّ الِاسْكَانُ حُصِّلَا"],["وَفِي كَلِمَاتِ ٱلسُّحۡتِ عَمَّ نُهَى فَتىً","وَكَيْفَ أَتَى أُذۡنࣱ بِهِ نَافِعٌ تَلاَ"],["وَرُحۡمࣰا سِوَى الشَّامِي وَنُذۡرًا صِحَابُهُمْ","حَمَوْهُ، وَنُكۡرࣰا شَرْحُ حَقٍّ لَهُ عُلَى"],["وَنُكۡرٍ دَنَا، وَٱلۡعَيۡنَ فَارْفَعْ وَعَطْفَهَا","رِضاً، وَٱلۡجُرُوحَ ارْفَعْ رِضَا نَفَرٍ مَلَا"],["وَحَمْزَةُ وَلۡيَحۡكُمۡ بِكَسْرٍ وَنَصْبِهِ","يُحَرِّكُهُ، تَبۡغُونَ خَاطَبَ كُمَّلَا"],["وَقَبْلَ يَقُولُ الوَاوُ غُصْنٌ وَرَافِعٌ","سِوَى ابْنِ العَلَا، مَن يَرۡتَدِدۡ عَمَّ مُرْسَلَا"],["وَحُرِّكَ بِالإِدْغَامِ لِلْغَيْرِ دَالُهُ","وَبِالخَفْضِ وَٱلۡكُفَّارِ رَاوِيهِ حَصَّلَا"],["وَبَا عَبُدَ اضْمُمْ واخْفِضِ التَّاءَ بَعْدُ فُزْ","رِسَالَٰتِهِ اجْمَعْ وَاكْسِرِ التَّا كَمَا اعْتَلَى"],["صَفَا، وَتَكُونُ الرَّفْعُ حَجَّ شُهُودُهُ","وَعَقَّدتُّمُ التَّخْفِيفُ مِنْ صُحْبَةٍ وِلَا"],["وَفِي العَيْنِ فَامْدُدْ مُقْسِطاً، فَجَزَآءُ نَوْ","وِنُوا مِثۡلُ مَا فِي خَفْضِهِ الرَّفْعُ ثُمَّلَا"],["وَكَفَّٰرَةࣱ نَوِّنْ، طَعَامُ بِرَفْعِ خَفْـ","ـضِهِ دُمْ غِنىً، وَاقْصُرْ قِيَٰمࣰا لَهُ مُلَا"],["وَضَمَّ ٱسۡتُحِقَّ افْتَحْ لِحَفْصٍ وَكَسْرَهُ","وَفِي ٱلۡأَوۡلَيَٰنِ ٱلۡأَوَّلِينَ فَطِبْ صِلَا"],["وَضَمَّ ٱلۡغُيُوبِ يَكْسِرَانِ، عُيُونٍ ٱلۡـ","ـعُيُونِ شُيُوخࣰا دَانَهُ صُحْبَةٌ مِلاَ"],["جُيُوبِ مُنِيرٌ دُونَ شَكٍّ، وَسَـٰحِرࣱ","بِ:سِحۡرٍ بِهَا مَعْ هُودَ وَالصَّفِّ شَمْلَلَا"],["وَخَاطَبَ فِي هَلۡ تَسۡتَطِيعُ رُوَاتُهُ","وَرَبُّكَ رَفْعُ البَاءِ بِالنَّصْبِ رُتِّلاَ"],["وَيَوۡمُ بِرَفْعٍ خُذْ، وَإِنِّى ثَلَاثُهَا","وَلِي وَيَدِي أُمِّي مُضَافَاتُهَا العُلَى"],["وَصُحْبَةُ يُصۡرَفۡ فَتْحُ ضَمٍّ وَرَاؤُهُ","بِكَسْرٍ، وَذَكِّرْ لَمۡ يَكُنۡ شَاعَ وَانْجَلَى"],["وَفِتۡنَتُهُمۡ بِالرَّفْعِ عَنْ دِينِ كَامِلٍ","وَبَا رَبَّنَا بِالنَّصْبِ شَرَّفَ وُصَّلاَ"],["نُكَذِّبُ نَصْبُ الرَّفْعِ فَازَ عَلِيمُهُ","وَفِي وَنَكُونَ انْصِبْهُ فِي كَسْبِهِ عُلَى"],["وَلَلدَّارُ حَذْفُ اللَّامِ الُاخْرَى ابْنُ عَامِرٍ","وَٱلَاخِرَةُ المَرْفُوعُ بِالخَفْضِ وُكِّلاَ"],["وَعَمَّ عُلىً لَا يَعۡقِلُونَ وَتَحْتَهَا","خِطَاباً وَقُلْ فِي يُوسُفٍ عَمَّ نَيْطَلَا"],["وَيَاسِينَ مِنْ أَصْلٍ، وَلَا يُكۡذِبُونَكَ الـ","ـخَفِيفُ أَتَى رَحْباً وَطَابَ تَأَوُّلَا"],["رَءَيۡتَ فِي الِاسْتِفْهَامِ لَا عَيْنَ رَاجِعٌ","وَعَنْ نَافِعٍ سَهِّلْ وَكَمْ مُبْدِلٍ جَلَا"],["إِذَا فُتِحَتۡ شَدِّدْ لِشَامٍ وَهَهُنَا","فَتَحۡنَا وَفِي الأَعْرَافِ وَاقْتَرَبَتْ كَلَا"],["وَبِٱلۡغُدۡوَةِ الشَّامِيُّ بِالضَّمِّ هَهُنَا","وَعَنْ أَلِفٍ وَاوٌ وَفِي الكَهْفِ وَصَّلاَ"],["وَأَنَّ بِفَتْحٍ عَمَّ نَصْراً وَبَعْدُ كَمْ","نَمَى، يَسۡتَبِينَ صُحْبَةٌ ذَكَّرُوا وِلَا"],["سَبِيلُ بِرَفْعٍ خُذْ وَيَقۡضِ بِضَمِّ سَا","كِنٍ مَعَ ضَمِّ الكَسْرِ شَدِّدْ وَأَهْمِلاَ"],["نَعَمْ دُونَ إِلْبَاسٍ، وَذَكَّرَ مُضْجِعاً","تَوَفَّىٰهُ وَٱسۡتَهۡوَىٰهُ حَمْزَةُ مُنْسِلاَ"],["مَعاً خُفۡيَةࣰ فِي ضَمِّهِ كَسْرُ شُعْبَةٍ","وَأَنجَيۡتَ لِلْكُوفِيِّ أَنجَىٰ تَحَوَّلَا"],["قُلِ ٱللَّهُ يُنجِيكُمۡ يُثَقِّلُ مَعْهُمُ","هِشَامٌ، وَشَامٍ يُنسِيَنَّكَ ثَقَّلاَ"],["وَحَرْفَيْ رَءَا كُلاًّ أَمِلْ مُزْنَ صُحْبَةٍ","وَفِي هَمْزِهِ حُسْنٌ، وَفِي الرَّاءِ يُجْتَلَى"],["بِخُلْفٍ، وَخُلْفٌ فِيهِمَا مَعَ مُضْمَرٍ","مُصِيبٌ، وَعَنْ عُثْمَانَ فِي الكُلِّ قُلِّلَا"],["وَقَبْلَ السُّكُونِ الرَّا أَمِلْ فِي صَفَا يَدٍ","بِخُلْفٍ، وَقُلْ فِي الهَمْزِ خُلْفٌ يَقِي صِلَا"],["وَقِفْ فِيهِ كَالأُولَى وَنَحْوُ رَأَتۡ رَأَوۡاْ","رَأَيۡتَ بِفَتْحِ الكُلِّ وَقْفاً وَمَوْصِلاَ"],["وَخَفَّفَ نُوناً قَبْلَ فِي ٱللَّهِ مَنْ لَهُ","بِخُلْفٍ أَتَى وَالحَذْفُ لَمْ يَكُ أَوَّلَا"],["وَفِي دَرَجَٰتِ النُّونُ مَعْ يُوسُفٍ ثَوَى","وَوَٱلۡيَسَعَ الحَرْفَانِ حَرِّكْ مُثَقِّلاَ"],["وَسَكِّنْ شِفَاءً، وَٱقۡتَدِهۡ حَذْفُ هَائِهِ","شِفَاءٌ وَبِالتَّحْرِيكِ بِالكَسْرِ كُفِّلَا"],["وَمُدَّ بِخُلْفٍ مَاجَ وَالكُلُّ وَاقِفٌ","بِإِسْكَانِهِ يَذْكُو عَبِيراً وَمَنْدَلَا"],["وَيُبۡدُونَهَا، يُخۡفُونَ مَعْ يَجۡعَلُونَهُ","عَلَى غَيْبِهِ حَقّاً وَيُنذِرَ صَنْدَلَا"],["وَبَيۡنَكُمُ ارْفَعْ فِي صَفَا نَفَرٍ، وَجَٰـ","ـعِلُ اقْصُرْ وَفَتْحُ الكَسْرِ وَالرَّفْعِ ثَمَّلَا"],["وَعَنْهُمْ بِنَصْبِ ٱلَّيۡلِ وَاكْسِرْ بِ:مُسۡتَقِرۡ","رٍ القَافَ حَقّاً، خَرَّقُواْ ثِقْلُهُ انْجَلَى"],["وَضَمَّانِ مَعْ يَاسِينَ فِي ثُمُرٍ شَفَا","وَدَٰرَسۡتَ حَقٌّ مَدُّهُ وَلَقَدْ حَلاَ"],["وَحَرِّكْ وَسَكِّنْ كَافِياً وَاكْسِرِ انَّهَا","حِمَى صَوْبِهِ بِالخُلْفِ دَرَّ وَأَوْبَلاَ"],["وَخَاطَبَ فِيهَا تُؤۡمِنُونَ كَمَا فَشَا","وَصُحْبَةُ كُفْءٍ فِي الشَّرِيعَةِ وَصَّلاَ"],["وَكَسْرٌ وَفَتْحٌ ضُمَّ فِي قُبُلࣰا حَمَى","ظَهِيراً وَلِلْكُوفِيِّ فِي الكَهْفِ وُصِّلَا"],["وَقُلْ كَلِمَٰتُ دُونَ مَا أَلِفٍ ثَوَى","وَفِي يُونُسٍ وَالطَّوْلِ حَامِيهِ ظَلَّلَا"],["وَشَدَّدَ حَفْصٌ مُنزَلࣱ وَابْنُ عَامِرٍ","وَحُرِّمَ فَتْحُ الضَّمِّ وَالكَسْرِ إِذْ عَلَا"],["وَفَصَّلَ إِذْ ثَنَّى، يُضِلُّونَ ضُمَّ مَعْ","يُضِلُّواْ الَّذِي فِي يُونُسٍ ثَابِتاً وَلاَ"],["رِسَالَٰتِ فَرْدٌ وَافْتَحُوا دُونَ عِلَّةٍ","وَضَيۡقًا مَعَ الفُرْقَانِ حَرِّكْ مُثَقِّلاَ"],["بِكَسْرٍ سِوَى المَكِّي، وَرَا حَرَجࣰا هُنَا","عَلَى كَسْرِهَا إِلْفٌ صَفَا وَتَوَسَّلاَ"],["وَيَصۡعَدُ خِفٌّ سَاكِنٌ دُمْ وَمَدُّهُ","صَحِيحٌ وَخِفُّ العَيْنِ دَاوَمَ صَنْدَلَا"],["وَيَحۡشُرُ مَعْ ثَانٍ بِيُونُسَ وَهْوَ فِي","سَبَا مَعْ يَقُولُ اليَا فِي الَارْبَعِ عُمِّلَا"],["وَخَاطَبَ شَامٍ تَعۡمَلُونَ، وَمَن يَكُو","نُ فِيهَا وَتَحْتَ النَّمْلِ ذَكِّرْهُ شُلْشُلَا"],["مَكَانَٰتِ مَدَّ النُّونَ فِي الكُلِّ شُعْبَةٌ","بِزُعۡمِهِمُ الحَرْفَانِ بِالضَّمِّ رُتِّلاَ"],["وَزُيِّنَ فِي ضَمٍّ وَكَسْرٍ وَرَفْعُ قَتۡـ","ـلُ أَوۡلَٰدَهُمۡ بِالنَّصْبِ شَامِيُّهُمْ تَلَا"],["وَيُخْفَضُ عَنْهُ الرَّفْعُ فِي شُرَكَآؤُهُمۡ","وَفِي مُصْحَفِ الشَّامِينَ بِاليَاءِ مُثِّلَا"],["وَمَفْعُولُهُ بَيْنَ المُضَافَيْنِ فَاصِلٌ","وَلَمْ يُلْفَ غَيْرُ الظَّرْفِ فِي الشِّعْرِ فَيْصَلَا"],["كَ:«لِلَّهِ دَرُّ اليَوْمَ مَنْ لَامَهَا» فَلاَ","تَلُمْ مِنْ مُلِيمِ النَّحْوِ إِلَّا مُجَهِّلاَ"],["وَمَعْ رَسْمِهِ «زَجَّ القَلُوصَ أَبِي مَزَا","دَهَ» الأَخْفَشُ النَّحْوِيُّ أَنْشَدَ مُجْمِلَا"],["وَإِن تَكُنَ انِّثْ كُفْءَ صِدْقٍ، وَمَيۡتَةࣱ","دَنَا كَافِياً، وَافْتَحْ حَصَادِ كَذِي حُلَى"],["نَمَى، وَسُكُونُ ٱلۡمَعۡزِ حِصْنٌ، وَأَنَّثُوا","تَكُونُ كَمَا فِي دِينِهِمْ، مَيۡتَةࣱ كَلاَ"],["وَتَذَّكَّرُونَ الكُلُّ خَفَّ عَلَى شَذاً","وَإِنَّ اكْسِرُوا شَرْعاً وَبِالخِفِّ كُمِّلَا"],["وَيَأۡتِيَهُمۡ شَافٍ مَعَ النَّحْلِ، فَٰرَقُواْ","مَعَ الرُّومِ مَدَّاهُۥ خَفِيفاً وَعَدَّلَا"],["وَكَسْرٌ وَفَتْحٌ خَفَّ فِي قِيَمࣰا ذَكَا","وَيَاءَاتُهَا: وَجۡهِي، مَمَاتِىَ مُقْبِلَا"],["وَرَبِّي، صِرَٰطِي ثُمَّ إِنِّى ثَلَاثَةٌ","وَمَحۡيَايَ وَالإِسْكَانُ صَحَّ تَحَمُّلاَ"],["وَتَذَّكَّرُونَ الغَيْبَ زِدْ قَبْلَ تَائِهِ","كَرِيماً وَخِفُّ الذَّالِ كَمْ شَرَفاً عَلَا"],["مَعَ الزُّخْرُفِ اعْكِسْ تُخۡرَجُونَ بِفَتْحَةٍ","وَضَمٍّ وَأُولَى الرُّومِ شَافِيهِ مُثِّلَا"],["بِخُلْفٍ مَضَى فِي الرُّومِ، لَا يَخۡرُجُونَ فِي","رِضاً، وَلِبَاسُ الرَّفْعُ فِي حَقِّ نَهْشَلَا"],["وَخَالِصَةࣱ أَصْلٌ وَلَا يَعۡلَمُونَ قُلْ","لِشُعْبَةَ فِي الثَّانِي وَيُفۡتَحُ شَمْلَلَا"],["وَخَفِّفْ شَفَا حُكْماً، وَمَا الوَاوَ دَعْ كَفَى","وَحَيْثُ نَعَمۡ بِالكَسْرِ فِي العَيْنِ رُتِّلَا"],["وَأَن لَّعۡنَةُ التَّخْفِيفُ وَالرَّفْعُ نَصُّهُ","سَمَا مَا خَلَا البَزِّي وَفِي النُّورِ أُوصِلاَ"],["وَيُغۡشِي بِهَا وَالرَّعْدِ ثَقَّلَ صُحْبَةٌ","وَوَٱلشَّمۡسُ مَعْ عَطْفِ الثَّلَاثَةِ كَمَّلَا"],["وَفِي النَّحْلِ مَعْهُۥ فِي الأَخِيرَيْنِ حَفْصُهُمْ","وَنُشۡرًا سُكُونُ الضَّمِّ فِي الكُلِّ ذُلِّلاَ"],["وَفِي النُّونِ فَتْحُ الضَّمِّ شَافٍ وَعَاصِمٌ","رَوَى نُونَهُ بِالبَاءِ نُقْطَةٌ اَسْفَلاَ"],["وَرَا مِنۡ إِلَٰهٍ غَيۡرُهُۥ خَفْضُ رَفْعِهِ","بِكُلٍّ رَسَا، وَالخِفُّ أُبۡلِغُكُمۡ حَلَا"],["مَعَ احْقَافِهَا، وَالوَاوَ زِدْ بَعْدَ مُفۡسِدِيـ","ـنَ كُفْئاً، وَبِالإِخْبَارِ إِنَّكُمُۥ عَلاَ"],["أَلَا، وَعَلاَ الحِرْمِيُّ إِنَّ لَنَا هُنَا","وَأَوۡ أَمِنَ الإِسْكَانُ حِرْمِيُّهُ كَلاَ"],["عَلَيَّ عَلَىٰ خَصُّوا، وَفِي سَٰحِرٍ بِهَا","وَيُونُسَ سَحَّـٰرٍ شَفَا وتَسَلْسَلاَ"],["وَفِي الكُلِّ تَلۡقَفۡ خِفُّ حَفْصٍ، وَضُمَّ فِي","سَنَقۡتُلُ وَاكْسِرْ ضَمَّهُ مُتَثَقِّلاَ"],["وَحَرِّكْ ذُكَا حُسْنٍ وَفِي يَقۡتُلُونَ خُذْ","مَعاً يَعۡرِشُونَ الكَسْرَ ضُمَّ كَذِي صِلَا"],["وَفِي يَعۡكُفُونَ الضَّمُّ يُكْسَرُ شَافِياً","وَأَنجَىٰ بِحَذْفِ اليَاءِ وَالنُّونِ كُفِّلَا"],["وَدَكَّآءَ لَا تَنْوِينَ وَامْدُدْهُ هَامِزاً","شَفَا وَعَنِ الكُوفِيِّ فِي الكَهْفِ وُصِّلَا"],["وَجَمْعُ رِسَٰلَٰتِي حَمَتْهُ ذُكُورُهُ","وَفِي ٱلرُّشۡدِ حَرِّكْ وَافْتَحِ الضَّمَّ شُلْشُلَا"],["وَفِي الكَهْفِ حُسْنَاهُۥ، وَضَمُّ حُلِيِّهِمۡ","بِكَسْرٍ شَفَا وَافٍ وَالِاتْبَاعُ ذُو حُلَى"],["وَخَاطَبَ تَرۡحَمۡنَا وَتَغۡفِرۡ لَنَا شَذاً","وَبَا رَبَّنَا رَفْعٌ لِغَيْرِهِمَا انْجَلَى"],["وَمِيمَ ٱبۡنَ أُمَّ اكْسِرْ مَعاً كُفْءَ صُحْبَةٍ","وَءَاصَٰرَهُمۡ بِالجَمْعِ وَالمَدِّ كُلِّلَا"],["خَطِيٓـَٔـٰتُكُمۡ وَحِّدْهُ عَنْهُ وَرَفْعُهُ","كَمَا أَلَّفُوا وَالغَيْرُ بِالكَسْرِ عَدَّلَا"],["وَلَكِنْ خَطَٰيَٰ حَجَّ فِيهَا وَنُوحِهَا","وَمَعۡذِرَةࣱ رَفْعٌ سِوَى حَفْصِهِمْ تَلاَ"],["وَبِيسٍ بِيَاءٍ أَمَّ وَالهَمْزُ كَهْفُهُ","وَمِثْلَ «رَئِيسٍ» غَيْرُ هَذَيْنِ عَوَّلَا"],["وَبَيۡـَٔسٍ اَسْكِنْ بَيْنَ فَتْحَيْنِ صَادِقاً","بِخُلْفٍ، وَخَفِّفْ يُمۡسِكُونَ صَفاً وِلَا"],["وَيَقْصُرُ ذُرِّيَّٰتِ مَعْ فَتْحِ تَائِهِ","وَفِي الطُّورِ فِي الثَّانِي ظَهِيرٌ تَحَمَّلَا"],["وَيَاسِينَ دُمْ غُصْناً وَيُكْسَرُ رَفْعُ أَوْ","وَلِ الطُّورِ لِلْبِصْرِي وَبِالمَدِّ كَمْ حَلَا"],["يَقُولُواْ مَعاً غَيْبٌ حَمِيدٌ، وَحَيْثُ يُلۡـ","ـحِدُونَ بِفَتْحِ الضَّمِّ وَالكَسْرِ فُصِّلَا"],["وَفِي النَّحْلِ وَالَاهُ الكِسَائِي، وَجَزْمُهُمْ","يَذَرۡهُمۡ شَفَا وَاليَاءُ غُصْنٌ تَهَدَّلَا"],["وَحَرِّكْ وَضُمَّ الكَسْرَ وَامْدُدْهُ هَامِزاً","وَلَا نُونَ شِرۡكًا عَنْ شَذَا نَفَرٍ مِلاَ"],["وَلَا يَتۡبَعُوكُمۡ خَفَّ مَعْ فَتْحِ بَائِهِ","وَيَتۡبَعُهُمۡ فِي الظُّلَّةِ احْتَلَّ وَاعْتَلَى"],["وَقُلْ طَٰٓئِفࣱ طَيۡفࣱ رِضاً حَقُّهُ، وَيَا","يَمُدُّونَ فَاضْمُمْ وَاكْسِرِ الضَّمَّ أَعْدَلَا"],["وَرَبِّي، مَعِي، بَعۡدِي وَإِنِّى كِلَاهُمَا","عَذَابِىَ، ءَايَٰتِي مُضَافَاتُهَا العُلَى"],["وَفِي مُرۡدِفِينَ الدَّالَ يَفْتَحُ نَافِعٌ","وَعَنْ قُنْبُلٍ يُرْوَى وَلَيْسَ مُعَوَّلَا"],["وَيُغۡشِي سَمَا خِفّاً وَفِي ضَمِّهِ افْتَحُوا","وَفِي الكَسْرِ حَقّاً، وَٱلنُّعَاسَ ارْفَعُوا وِلَا"],["وَتَخْفِيفُهُمْ فِي الأَوَّلَيْنِ هُنَا وَلَٰـ","ـكِنِ ٱللَّهُ وَارْفَعْ هَاءَهُ شَاعَ كُفَّلَا"],["وَمُوهِنُ بِالتَّخْفِيفِ ذَاعَ وَفِيهِ لَمْ","يُنَوَّنْ لِحَفْصٍ، كَيۡدِ بِالخَفْضِ عُوِّلَا"],["وَبَعْدُ وَأَنَّ الفَتْحُ عَمَّ عُلىً، وَفِيـ","ـهِمَا ٱلۡعُدۡوَةِ اكْسِرْ حَقّاً الضَّمَّ وَاعْدِلَا"],["وَمَنۡ حَـِۧيَ اكْسِرْ مُظْهِراً إِذْ صَفَا هُدىً","وَإِذۡ تَتَوَفَّىٰ أَنِّثُوهُ لَهُ مُلاَ"],["وَبِالغَيْبِ فِيهَا يَحۡسِبَنَّ كَمَا فَشَا","عَمِيماً وَقُلْ فِي النُّورِ فَاشِيهِ كَحَّلَا"],["وَأَنَّهُمُ افْتَحْ كَافِياً، وَاكْسِرُوا لِشُعْـ","ـبَةَ السِّلۡمَ وَاكْسِرْ فِي القِتَالِ فَطِبْ صِلَا"],["وَثَانِي يَكُنۡ غُصْنٌ وَثَالِثُهَا ثَوَى","وَضُعۡفࣰا بِفَتْحِ الضَّمِّ فَاشِيهِ نُفِّلَا"],["وَفِي الرُّومِ صِفْ عَنْ خُلْفِ فَصْلٍ، وَأَنِّثَ انۡ","تَكُونَ مَعَ ٱلۡأَسۡرَىٰ ٱلۡأُسَٰرَىٰ حُلىً حَلَا"],["وِلَٰيَتِهِمۡ بِالكَسْرِ فُزْ وَبِكَهْفِهِ","شَفَا، وَمَعاً إِنِّى بِيَاءَيْنِ أَقْبَلاَ"],["وَيُكْسَرُ لَا إِيمَٰنَ عِنْدَ ابْنِ عَامِرٍ","وَوَحَّدَ حَقٌّ مَسۡجِدَ ٱللَّهِ الَاوَّلَا"],["عَشِيرَٰتُكُمۡ بِالجَمْعِ صِدْقٌ، وَنَوِّنُوا","عُزَيۡرٌ رِضَا نَصٍّ وَبِالكَسْرِ وُكِّلاَ"],["يُضَٰهُونَ ضَمَّ الهَاءِ يَكْسِرُ عَاصِمٌ","وَزِدْ هَمْزَةً مَضْمُومَةً عَنْهُ وَاعْقِلاَ"],["يُضَلُّ بِضَمِّ اليَاءِ مَعْ فَتْحِ ضَادِهِ","صِحَابٌ وَلَمْ يَخْشَوْا هُنَاكَ مُضَلِّلَا"],["وَأَن يُقۡبَلَ التَّذْكِيرُ شَاعَ وِصَالُهُ","وَرَحۡمَةࣱ المَرْفُوعُ بِالخَفْضِ فَاقْبَلَا"],["وَيُعۡفَ بِنُونٍ دُونَ ضَمٍّ وَفَاؤُهُ","يُضَمُّ، تُعَذَّبۡ تَاهُ بِالنُّونِ وُصِّلاَ"],["وَفِي ذَالِهِ كَسْرٌ وَطَآئِفَةࣱ بِنَصْـ","ـبِ مَرْفُوعِهِ عَنْ عَاصِمٍ كُلُّهُ اعْتَلَى"],["وَحَقٌّ بِضَمِّ ٱلسَّوۡءِ مَعْ ثَانِ فَتْحِهَا","وَتَحْرِيكُ وَرْشٍ قُرۡبَةࣱ ضَمَّهُ جَلاَ"],["وَمِن تَحۡتِهَا المَكِّي يَجُرُّ وَزَادَ مِنۡ","صَلَوٰتَكَ وَحِّدْ وَافْتَحِ التَّا شَذاً عَلَا"],["وَوَحِّدْ لَهُمْ فِي هُودَ، تُرۡجِئُ هَمْزُهُ","صَفَا نَفَرٍ مَعْ مُرۡجَـُٔونَ وَقَدْ حَلاَ"],["وَعَمَّ بِلاَ وَاوِ ٱلَّذِينَ وَضُمَّ فِي","مَنُ اسِّسَ مَعْ كَسْرٍ وَبُنۡيَٰنُهُۥ وِلَا"],["وَجُرۡفٍ سُكُونُ الضَّمِّ فِي صَفْوِ كَامِلٍ","تَقَطَّعَ فَتْحُ الضَّمِّ فِي كَامِلٍ عَلَا"],["يَزِيغُ عَلَى فَصْلٍ، تَرَوۡنَ مُخَاطِبٌ","فَشَا، وَمَعِي فِيهَا بِيَاءَيْنِ جُمِّلَا"],["وَإِضْجَاعُ رَا كُلِّ الفَوَاتِحِ ذِكْرُهُ","حِمىً غَيْرَ حَفْصٍ، طَا وَيَا صُحْبَةٌ وِلَا"],["وَكَمْ صُحْبَةٍ يَا «كَافَ» وَالخُلْفُ يَاسِرٌ","وَهَا صِفْ رِضاً حُلْواً وَتَحْتُ جَنىً حَلَا"],["شَفَا صَادِقاً، حَامِيمَ مُخْتَارُ صُحْبَةٍ","وَبَصْرٍ وَهُمْ أَدۡرَىٰ وَبِالخُلْفِ مُثِّلَا"],["وَذُو الرَّا لِوَرْشٍ بَيْنَ بَيْنَ وَنَافِعٌ","لَدَى مَرْيَمٍ هَايَا، وَحَا جِيدُهُ حَلَا"],["يُفَصِّلُ يَا حَقٍّ عَلَا، سَٰحِرࣱ ظُبىً","وَحَيْثُ ضِيَآءࣱ وَافَقَ الهَمْزُ قُنْبُلاَ"],["وَفِي قُضِيَ الفَتْحَانِ مَعْ أَلِفٍ هُنَا","وَقُلْ أَجَلُ المَرْفُوعُ بِالنَّصْبِ كُمِّلَا"],["وَقَصْرُ وَلَا هَادٍ بِخُلْفٍ زَكَا وَفِي الـ","ـقِيَامَةِ لَا الأُولَى وَبِالحَالِ أُوِّلَا"],["وَخَاطَبَ عَمَّا تُشۡرِكُونَ هُنَا شَذاً","وَفِي الرُّومِ وَالحَرْفَيْنِ فِي النَّحْلِ أَوَّلَا"],["يُسَيِّرُكُمۡ قُلْ فِيهِ يَنشُرُكُمۡ كَفَى","مَتَٰعُ سِوَى حَفْصٍ بِرَفْعٍ تَحَمَّلاَ"],["وَإِسْكَانُ قِطۡعࣰا دُونَ رَيْبٍ وُرُودُهُ","وَفِي بَاءِ تَبۡلُو التَّاءُ شَاعَ تَنَزُّلَا"],["وَيَا لَا يَهِدِّي اكْسِرْ صَفِيّاً وَهَاهُ نَلْ","وَأَخْفَى بَنُو حَمْدٍ وَخُفِّفَ شُلْشُلَا"],["وَلَٰكِنۡ خَفِيفٌ وَارْفَعِ ٱلنَّاسَ عَنْهُمَا","وَخَاطَبَ فِيهَا تَجۡمَعُونَ لَهُ مُلاَ"],["وَيَعۡزُبُ كَسْرُ الضَّمِّ مَعْ سَبَأً رَسَا","وَأَصۡغَرُ فَارْفَعْهُۥ وَأَكۡبَرُ فَيْصَلَا"],["مَعَ المَدِّ قَطْعُ ٱلسِّحۡرِ حُكْمٌ، تَبَوَّءَا","بِيَا وَقْفُ حَفْصٍ لَمْ يَصِحَّ فَيُحْمَلَا"],["وَتَتَّبِعَانِ النُّونُ خَفَّ مَداً وَمَ","جَ بِالفَتْحِ وَالإِسْكَانِ قَبْلُ مُثَقَّلاَ"],["وَفِي إِنَّهُ اكْسِرْ شَافِياً، وَبِنُونِهِ","وَنَجۡعَلُ صِفْ، وَالخِفُّ نُنجِ رِضاً عُلَى"],["وَذَاكَ هُوَ الثَّانِي، وَنَفۡسِيَ يَاؤُهَا","وَرَبِّيَ مَعْ أَجۡرِي وَإِنِّى وَلِى حُلَى"],["وَأَنِّى لَكُمۡ بِالفَتْحِ حَقُّ رُوَاتِهِ","وَبَادِيَ بَعْدَ الدَّالِ بِالهَمْزِ حُلِّلَا"],["وَمِن كُلِّ نَوِّنْ مَعْ «قَدَ افْلَحَ» عَالِماً","فَعُمِّيَتِ اضْمُمْهُۥ وَثَقِّلْ شَذاً عَلاَ"],["وَفِي ضَمِّ مُجۡرَىٰهَا سِوَاهُمْ، وَفَتْحُ يَٰـ","ـبُنَيَّ هُنَا نَصٌّ وَفِي الكُلِّ عُوِّلَا"],["وَآخِرَ لُقْمَانٍ يُوَالِيهِ أَحْمَدُ","وَسَكَّنَهُ زَاكٍ، وَشَيْخُهُ الَاوَّلَا"],["وَفِي عَمَلٌ فَتْحٌ وَرَفْعٌ وَنَوِّنُوا","وَغَيۡرَ ارْفَعُوا إِلَّا الكِسَائِيَّ ذَا المَلَا"],["وَتَسۡـَٔلۡنِ خِفُّ الكَهْفِ ظِلُّ حِمىً وَهَـ","ـهُنَا غُصْنُهُ وَافْتَحْ هُنَا نُونَهُ دَلَا"],["وَيَوۡمِئِذٍ مَعْ «سَالَ» فَافْتَحْ أَتَى رِضاً","وَفِي النَّمْلِ حِصْنٌ قَبْلَهُ «النُّونُ» ثَمَّلَا"],["ثَمُودَاْ مَعَ الفُرْقَانِ وَالعَنْكَبُوتِ لَمْ","يُنَوَّنْ عَلَى فَصْلٍ وَفِي النَّجْمِ فُصِّلَا"],["نَمَى، لِثَمُودٍ نَوِّنُوا وَاخْفِضُوا رِضاً","وَيَعۡقُوبَ نَصْبُ الرَّفْعِ عَنْ فَاضِلٍ كَلَا"],["هُنَا قَالَ سِلۡمࣱ كَسْرُهُ وَسُكُونُهُ","وَقَصْرٌ وَفَوْقَ الطُّورِ شَاعَ تَنَزُّلَا"],["وَفَٱسۡرِ، أَنِ ٱسۡرِ الوَصْلُ أَصْلٌ دَنَا، وَهَـ","ـهُنَا حَقٌّ اِلَّا ٱمۡرَاتُكَ ارْفَعْ وَأَبْدِلَا"],["وَفِي سَعِدُواْ فَاضْمُمْ صِحَاباً وَسَلْ بِهِ","وَخِفُّ وَإِن كُلࣰّا إِلَى صَفْوِهِ دَلاَ"],["وَفِيهَا وَفِي يَاسِينَ وَالطَّارِقِ العُلَى","يُشَدِّدُ لَمَّا كَامِلٌ نَصَّ فَاعْتَلَى"],["وَفِي زُخْرُفٍ فِي نَصِّ لُسْنٍ بِخُلْفِهِ","وَيُرۡجَعُ فِيهِ الضَّمُّ وَالفَتْحُ إِذْ عَلَا"],["وَخَاطَبَ عَمَّا تَعۡمَلُونَ بِهَا وَآ","خِرَ النَّمْلِ عِلْماً عَمَّ وَارْتَادَ مَنْزِلَا"],["وَيَاءَاتُهَا: عَنِّي وَإِنِّى ثَمَانِياً","وَضَيۡفِي وَلَٰكِنِّي وَنُصۡحِيَ فَاقْبَلاَ"],["شِقَاقِى وَتَوۡفِيقِي وَرَهۡطِيَ عُدَّهَا","وَمَعْ فَطَرَنۡ، أَجۡرِي مَعاً تُحْصِ مُكْمِلَا"],["وَيَـٰ أَبَتَ افْتَحْ حَيْثُ جَا لِابْنِ عَامِرٍ","وَوُحِّدَ لِلْمَكِّيِّ ءَايَٰتࣱ الوِلَا"],["غَيَٰبَٰتِ فِي الحَرْفَيْنِ بِالجَمْعِ نَافِعٌ","وَتَأۡمَــۨــــــنَا لِلْكُلِّ يُخْفَى مُفَصَّلَا"],["وَأَدْغَمَ مَعْ إِشْمَامِهِ البَعْضُ عَنْهُمُ","وَيَرۡتَعۡ وَيَلۡعَبۡ يَاءُ حِصْنٍ تَطَوَّلَا"],["وَيَرۡتَعۡ سُكُونُ الكَسْرِ فِي العَيْنِ ذُو حِمىً","وَبُشۡرَٰيَ حَذْفُ اليَاءِ ثَبْتٌ، وَمُيِّلاَ"],["شِفَاءً، وَقَلِّلْ جِهْبِذاً، وَكِلاَهُمَا","عَنِ ابْنِ العَلاَ وَالفَتْحُ عَنْهُ تَفَضَّلَا"],["وَهِيتَ بِكَسْرٍ أَصْلُ كُفْءٍ وَهَمْزُهُ","لِسَانٌ وَضَمُّ التَّا لِوَا خُلْفِهِ دَلَا"],["وَفِي «كَافَ» فَتْحُ اللَّامِ فِي مُخۡلِصࣰا ثَوَى","وَفِي ٱلۡمُخۡلِصِينَ الكُلِّ حِصْنٌ تَجَمَّلَا"],["مَعاً وَصْلُ حَٰشَ حَجَّ، دَأۡبࣰا لِحَفْصِهِمْ","فَحَرِّكْ، وَخَاطِبْ تَعۡصِرُونَ شَمَرْدَلَا"],["وَيَكۡتَلۡ بِيَا شَافٍ، وَحَيۡثُ نَشَآءُ نُو","نُ دَارٍ، وَحِفۡظࣰا حَٰفِظࣰا شَاعَ عُقَّلَا"],["وَفِتۡيَتِهِ فِتۡيَٰنِهِ عَنْ شَذاً، وَرُدْ","بِالِاخْبَارِ فِي قَالُواْ أَءِنَّكَ دَغْفَلاَ"],["وَيَايَسۡ مَعاً وَٱسۡتَٰيَسَ ٱسۡتَٰيَسُواْ وَتَا","يَسُواْ اقْلِبْ عَنِ البَزِّي بِخُلْفٍ وَأَبْدِلَا"],["وَنُوحِي إِلَيۡهِمۡ كَسْرُ حَاءِ جَمِيعِهَا","وَنُونٌ عُلىً، نُوحِي إِلَيۡهِ شَذاً عَلاَ"],["وَثَانِيَ نُـۨجِي احْذِفْ وَشَدِّدْ وَحَرِّكَنْ","كَذَا نَلْ، وَخَفِّفْ كُذِّبُواْ ثَابِتاً تَلاَ"],["وَأَنِّى وَإِنِّى الخَمْسُ رَبِّي بِأَرْبَعٍ","أَرَىٰنِي مَعاً، نَفۡسِي، لَيَحۡزُنُنِي حُلَى"],["وَفِي إِخۡوَتِى، حُزۡنِى، سَبِيلِىَ، بِى، وَلِى","لَعَلِّىَ، ءَابَآءِي، أَبِى فَاخْشَ مَوْحَلَا"],["وَزَرۡعࣱ، نَخِيلࣱ، غَيۡرُ، صِنۡوَانࣱ اَوَّلَا","لَدَى خَفْضِهَا رَفْعٌ عَلَا حَقُّهُ طُلَى"],["وَذَكَّرَ يُسۡقَيٰ عَاصِمٌ وَابْنُ عَامِرٍ","وَقُلْ بَعْدَهُ بِاليَا يُفَضِّلُ شُلْشُلَا"],["وَمَا كُرِّرَ اسْتِفْهَامُهُ نَحْوُ: أَٰءِذَا","أَءِنَّا فَذُو اسْتِفْهَامٍ الكُلُّ أَوَّلَا"],["سِوَى نَافِعٍ فِي النَّمْلِ، وَالشَّامِ مُخْبِرٌ","سِوَى النَّازِعَاتِ مَعْ «إِذَا وَقَعَتْ» وِلَا"],["وَدُونَ عِنَادٍ عَمَّ فِي العَنْكَبُوتِ مُخْـ","ـبِراً، وَهْوَ فِي الثَّانِي أَتَى رَاشِداً وَلَا"],["سِوَى العَنْكَبُوتِ، وَهْوَ فِي النَّمْلِ كُنْ رِضاً","وَزَادَاهُ نُوناً إِنَّنَا عَنْهُمَا اعْتَلَى"],["وَعَمَّ رِضاً فِي النَّازِعَاتِ، وَهُمْ عَلَى","أُصُولِهِمُۥ، وَامْدُدْ لِوَا حَافِظٍ بَلاَ"],["وَهَادࣲ وَوَالٍ قِفْ وَوَاقࣲ بِيَائِهِ","وَبَاقࣲ دَنَا، هَلۡ يَسۡتَوِي صُحْبَةٌ تَلاَ"],["وَبَعْدُ صِحَابٌ يُوقِدُونَ، وَضَمُّهُمْ","وَصُدُّواْ ثَوَى مَعْ صُدَّ فِي الطَّوْلِ وَانْجَلَى"],["وَيُثۡبِتُ فِي تَخْفِيفِهِ حَقُّ نَاصِرٍ","وَفِي ٱلۡكَٰفِرُ ٱلۡكُفَّٰرُ بِالجَمْعِ ذُلِّلاَ"],["وَفِي الخَفْضِ فِي ٱللَّهِ ٱلَّذِي الرَّفْعُ عَمَّ، خَٰـ","ـلِقُ امْدُدْهُ وَاكْسِرْ وَارْفَعِ القَافَ شُلْشُلَا"],["وَفِي النُّورِ وَاخْفِضْ كُلَّ فِيهَا وَٱلَارۡضَ هَـ","ـهُنَا، مُصۡرِخِيَّ اكْسِرْ لِحَمْزَةَ مُجْمِلَا"],["كَهَا وَصْلٍ اَوْ لِلسَّاكِنَيْنِ وَقُطْرُبٌ","حَكَاهَا مَعَ الفَرَّاءِ مَعْ وَلَدِ العَلاَ"],["وَضُمَّ كِفَا حِصْنٍ يُضِلُّواْ يُضِلَّ عَنۡ","وَأَفۡـِٔـۧدَةࣰ بِاليَا بِخُلْفٍ لَهُ وَلَا"],["وَفِي لِتَزُولَ الفَتْحُ وَارْفَعْهُ رَاشِداً","وَمَا كَانَ لِى، إِنِّى، عِبَادِيَ خُذْ مُلاَ"],["وَرُبَّ خَفِيفٌ إِذْ نَمَى، سُكِّرَتۡ دَنَا","تَنَزَّلُ ضَمُّ التَّا لِشُعْبَةَ مُثِّلاَ"],["وَبِالنُّونِ فِيهَا وَاكْسِرِ الزَّايَ وَانْصِبِ ٱلۡـ","ـمَلَٰٓئِكَةَ المَرْفُوعَ عَنْ شَائِدٍ عُلَى"],["وَثُقِّلَ لِلْمَكِّيِّ نُونُ تُبَشِّرُو","نَ وَاكْسِرْهُ حِرْمِيّاً وَمَا الحَذْفُ أَوَّلَا"],["وَيَقۡنِطُ مَعْهُۥ يَقۡنِطُونَ وَتَقۡنِطُواْ","وَهُنَّ بِكَسْرِ النُّونِ رَافَقْنَ حُمَّلَا"],["وَمُنجُوهُمُۥ خِفٌّ وَفِي العَنْكَبُوتِ نُنـ","ـجِيَنَّ شَفَا، مُنجُوكَ صُحْبَتُهُ دَلَا"],["قَدَرۡنَا بِهَا وَالنَّمْلِ صِفْ، وَعِبَادِ مَعْ","بَنَاتِى وَأَنِّى ثُمَّ إِنِّىَ فَاعْقِلاَ"],["وَنُنۢبِتُ نُونٌ صَحَّ، يَدۡعُونَ عَاصِمٌ","وَفِي شُرَكَايَ الخُلْفُ فِي الهَمْزِ هَلْهَلَا"],["وَمِنْ قَبْلِ فِيهِمۡ يَكْسِرُ النُّونَ نَافِعٌ","مَعاً يَتَوَفَّىٰهُمۡ لِحَمْزَةَ وُصِّلَا"],["سَمَا كَامِلاً يُهۡدَيٰ بِضَمٍّ وَفَتْحَةٍ","وَخَاطِبْ تَرَوۡاْ شَرْعاً وَالَاخِرُ فِي كِلَا"],["وَرَا مُفۡرِطُونَ اكْسِرْ أَضاً، تَتَفَيَّؤُاْ الـ","ـمُؤَنَّثُ لِلْبِصْرِيِّ قَبْلُ تُقُبِّلاَ"],["وَحَقُّ صِحَابٍ ضَمُّ نُسۡقِيكُمُۥ مَعاً","لِشُعْبَةَ خَاطِبْ تَجۡحَدُونَ مُعَلِّلاَ"],["وَظَعۡنِكُمُۥ إِسْكَانُهُ ذَائِعٌ، وَيَجۡـ","ـزِيَنَّ ٱلَّذِينَ النُّونُ دَاعِيهِ نَوَّلاَ"],["مَلَكْتَ وَعَنْهُۥ نَصَّ الَاخْفَشُ يَاءَهُ","وَعَنْهُ رَوَى النَّقَّاشُ نُوناً مُوَهَّلاَ"],["سِوَى الشَّامِ ضُمُّوا وَاكْسِرُوا فُتِنُواْ لَهُمْ","وَيُكْسَرُ فِي ضِيقࣲ مَعَ النَّمْلِ دُخْلُلَا"],["وَيَتَّخِذُواْ غَيْبٌ حَلاَ، لِنَسُوٓأَ نُو","نُ رَاوٍ وَضَمُّ الهَمْزِ وَالمَدُّ عُدِّلَا"],["سَمَا، وَيُلَقَّىٰهُۥ يُضَمُّ مُشَدَّداً","كَفَى، يَبۡلُغَنَّ امْدُدْهُ وَاكْسِرْ شَمَرْدَلَا"],["وَعَنْ كُلِّهِمْ شَدِّدْ، وَفَا أُفَّ كُلِّهَا","بِفَتْحٍ دَنَا كُفْئاً وَنَوِّنْ عَلَى اعْتِلاَ"],["وَبِالفَتْحِ وَالتَّحْرِيكِ خِطۡـࣰٔا مُصَوَّبٌ","وَحَرَّكَهُ المَكِّي وَمَدَّ وَجَمَّلاَ"],["وَخَاطَبَ فِي تُسۡرِفۡ شُهُودٌ، وَضَمُّنَا","بِحَرْفَيْهِ بِٱلۡقُسۡطَاسِ كَسْرُ شَذاً عَلاَ"],["وَسَيِّئَةً فِي هَمْزِهِ اضْمُمْ وَهَائِهِ","وَذَكِّرْ وَلَا تَنْوِينَ ذِكْراً مُكَمَّلاَ"],["وَخَفِّفْ مَعَ الفُرْقَانِ وَاضْمُمْ لِيَذۡكُرُواْ","شِفَاءً وَفِي الفُرْقَانِ يَذۡكُرُ فُصِّلَا"],["وَفِي مَرْيَمٍ بِالعَكْسِ حَقٌّ شِفَاؤُهُ","يَقُولُونَ عَنْ دَارٍ وَفِي الثَّانِ نُزِّلَا"],["سَمَا كِفْلُهُ، أَنِّثْ تُسَبِّحُ عَنْ حِمىً","شَفَا، وَاكْسِرُوا إِسْكَانَ رَجۡلِكَ عُمَّلَا"],["وَنَخۡسِفَ حَقٌّ نُونُهُ وَنُعِيدَكُمۡ","فَنُغۡرِقَكُمۡ وَاثْنَانِ نُرۡسِلَ نُرۡسِلَا"],["خِلَٰفَكَ فَافْتَحْ مَعْ سُكُونٍ وَقَصْرِهِ","سَمَا صِفْ، نَـَٔا أَخِّرْ مَعاً هَمْزَهُ مُلَا"],["تُفَجِّرَ فِي الأُولَى كَ:«تَقْتُلَ» ثَابِتٌ","وَعَمَّ نَدىً كِسۡفًا بِتَحْرِيكِهِ وِلَا"],["وَفِي سَبَأً حَفْصٌ مَعَ الشُّعَرَاءِ قُلْ","وَفِي الرُّومِ سَكِّنْ لَيْسَ بِالخُلْفِ مُشْكِلَا"],["وَقُلۡ قَٰلَ الُاولَى كَيْفَ دَارَ، وَضَمُّ تَا","عَلِمۡتُ رِضاً، وَاليَاءُ فِي رَبِّيَ انْجَلَى"],["وَسَكْتَةُ حَفْصٍ دُونَ قَطْعٍ لَطِيفَةٌ","عَلَى أَلِفِ التَّنْوِينِ فِي عِوَجࣰا بَلاَ"],["وَفِي نُونِ مَنۡ رَاقࣲ وَمَرۡقَدِنَا وَلَا","مِ بَلۡ رَانَ وَالبَاقُونَ لَا سَكْتَ مُوصَلَا"],["وَمِن لَّدۡنِهِۦ فِي الضَّمِّ أَسْكِنْ مُشِمَّهُ","وَمِنْ بَعْدِهِ كَسْرَانِ عَنْ شُعْبَةَ اعْتَلَى"],["وَضُمَّ وَسَكِّنْ ثُمَّ ضُمَّ لِغَيْرِهِ","وَكُلُّهُمُۥ فِي الهَا عَلَى أَصْلِهِ تَلاَ"],["وَقُلْ مَرۡفِقࣰا فَتْحٌ مَعَ الكَسْرِ عَمَّهُ","وَتَزۡوَرُّ لِلشَّامِي كَ:«تَحْمَرُّ» وُصِّلاَ"],["وَتَزَّٰوَرُ التَّخْفِيفُ فِي الزَّايِ ثَابِتٌ","وَحِرْمِيُّهُمْ مُلِّئۡتَ فِي اللاَّمِ ثَقَّلَا"],["بِوَرۡقِكُمُ الإِسْكَانُ فِي صَفْوِ حُلْوِهِ","وَفِيهِ عَنِ البَاقِينَ كَسْرٌ تَأَصَّلاَ"],["وَحَذْفُكَ لِلتَّنْوِينِ مِنْ مِاْئَةࣲ شَفَا","وَتُشۡرِكۡ خِطَابٌ وَهْوَ بِالجَزْمِ كُمِّلَا"],["وَفِي ثُمُرࣲ ضَمَّيْهِ يَفْتَحُ عَاصِمٌ","بِحَرْفَيْهِ وَالإِسْكَانُ فِي المِيمِ حُصِّلَا"],["وَدَعْ مِيمَ خَيۡرࣰا مِّنۡهُمَا حُكْمَ ثَابِتٍ","وَفِي الوَصْلِ لَٰكِنَّا فَمُدَّ لَهُ مُلَا"],["وَذَكِّرْ يَكُنۡ شَافٍ، وَفِي ٱلۡحَقِّ جَرُّهُ","عَلَى رَفْعِهِ حَبْرٌ سَعِيدٌ تَأَوَّلَا"],["وَعُقۡبࣰا سُكُونُ الضَّمِّ نَصُّ فَتىً، وَيَا","نُسَيِّرُ وَالَى فَتْحَهَا نَفَرٌ مِلاَ"],["وَفِي النُّونِ أَنِّثْ وَٱلۡجِبَالُ بِرَفْعِهِمْ","وَيَوۡمَ يَقُولُ النُّونُ حَمْزَةُ فَضَّلَا"],["لِمَهۡلَكِهِمۡ ضَمُّوا وَمَهۡلَكَ أَهۡلِهِ","سِوَى عَاصِمٍ وَالكَسْرُ فِي اللَّامِ عُوِّلَا"],["وَهَا كَسْرِ أَنسَىٰنِيهِ ضُمَّ لِحَفْصِهِمْ","وَمَعْهُ عَلَيۡهُ ٱللَّهَ فِي الفَتْحِ وَصَّلَا"],["لِتُغۡرِقَ فَتْحُ الضَّمِّ وَالكَسْرِ غَيْبَةً","وَقُلْ أَهۡلُهَا بِالرَّفْعِ رَاوِيهِ فَصَّلَا"],["وَمُدَّ وَخَفِّفْ يَاءَ زَٰكِيَةً سَمَا","وَنُونُ لَدُنِّى خَفَّ صَاحِبُهُ إِلَى"],["وَسَكِّنْ وَأَشْمِمْ ضَمَّةَ الدَّالِ صَادِقاً","تَخِذۡتَ فَخَفِّفْ وَاكْسِرِ الخَاءَ دُمْ حُلَى"],["وَمِنْ بَعْدُ بِالتَّخْفِيفِ يُبۡدِلَ هَهُنَا","وَفَوْقَ وَتَحْتَ المُلْكِ كَافِيهِ ظَلَّلَا"],["فَأَتۡبَعَ خَفِّفْ فِي الثَّلَاثَةِ ذَاكِراً","وَحَٰمِيَةࣲ بِالمَدِّ صُحْبَتُهُ كَلاَ"],["وَفِي الهَمْزِ يَاءٌ عَنْهُمُۥ وَصِحَابُهُمْ","جَزَآءُ فَنَوِّنْ وَانْصِبِ الرَّفْعَ وَاقْبَلاَ"],["عَلَى حَقٍّ السَّدَّيۡنِ، سَدࣰّا صِحَابُ حَقْـ","ـقٍ الضَّمُّ مَفْتُوحٌ وَيَاسِينَ شِدْ عُلَى"],["وَيَاجُوجَ مَاجُوجَ اهْمِزِ الكُلَّ نَاصِراً","وَفِي يَفۡقَهُونَ الضَّمُّ وَالكَسْرُ شُكِّلَا"],["وَحَرِّكْ بِهَا وَالمُؤْمِنِينَ وَمُدَّهُ","خَرَٰجًا شَفَا وَاعْكِسْ فَخَرۡجُ لَهُ مُلَا"],["وَمَكَّنَنِي أَظْهِرْ دَلِيلًا، وَسَكَّنُوا","مَعَ الضَّمِّ فِي ٱلصُّدۡفَيۡنِ عَنْ شُعْبَةِ المَلَا"],["كَمَا حَقُّهُ ضَمَّاهُ، وَاهْمِزْ مُسَكِّناً","لَدَى رَدۡمًا ٱءۡتُونِى وَقَبْلُ اكْسِرِ الوِلَا"],["لِشُعْبَةَ، وَالثَّانِي فَشَا صِفْ بِخُلْفِهِ","وَلَا كَسْرَ، وَابْدَأْ فِيهِمَا اليَاءَ مُبْدِلَا"],["وَزِدْ قَبْلُ هَمْزَ الوَصْلِ، وَالغَيْرُ فِيهِمَا","بِقَطْعِهِمَا وَالمَدِّ بَدْءاً وَمَوْصِلاَ"],["وَطَاءَ فَمَا ٱسۡطَٰعُواْ لِحَمْزَةَ شَدَّدُوا","وَأَن يَنفَدَ التَّذْكِيرُ شَافٍ تَأَوُّلَا"],["ثَلَاثُ مَعِي، دُونِى وَرَبِّي بِأَرْبَعٍ","وَمَا قَبْلَ إِن شَآءَ المُضَافَاتُ تُجْتَلَى"],["وَحَرْفَا يَرِثۡ بِالجَزْمِ حُلْوٌ رِضاً، وَقُلْ","خَلَقۡتُ خَلَقۡنَٰ شَاعَ وَجْهاً مُجَمَّلَا"],["وَضَمُّ بُكِيࣰّا كَسْرُهُ عَنْهُمَا وَقُلْ","عِتِيࣰّا صِلِيࣰّا مَعْ جِثِيࣰّا شَذاً عَلاَ"],["وَهَمْزُ أَهَبۡ بِاليَا جَرَى حُلْوُ بَحْرِهِ","بِخُلْفٍ، وَنِسۡيࣰا فَتْحُهُ فَائِزٌ عُلَى"],["وَمِن تَحۡتِهَا اكْسِرْ وَاخْفِضِ الدَّهْرَ عَنْ شَذاً","وَخَفَّ تَسَٰقَطۡ فَاصِلًا فَتُحُمِّلَا"],["وَبِالضَّمِّ وَالتَّخْفِيفِ وَالكَسْرِ حَفْصُهُمْ","وَفِي رَفْعِ قَوۡلُ ٱلۡحَقِّ نَصْبُ نَدٍ كَلَا"],["وَكَسْرُ وَإِنَّ ٱللَّهَ ذَاكٍ، وَأَخْبَرُوا","بِخُلْفٍ إِذَا مَا مُتُّ مُوفِينَ وُصَّلاَ"],["وَنُنجِي خَفِيفاً رُضْ، مُقَامࣰا بِضَمِّهِ","دَنَا، رِءۡيࣰا اَبْدِلْ مُدْغِماً بَاسِطاً مُلاَ"],["وَوُلۡدًا بِهَا وَالزُّخْرُفِ اضْمُمْ وَسَكِّنَنْ","شِفَاءً وَفِي نُوحٍ شَفَا حَقُّهُ وَلَا"],["وَفِيهَا وَفِي الشُّورَى يَكَادُ أَتَى رِضاً","وَطَا يَتَفَطَّرۡنَ اكْسِرُوا غَيْرَ أَثْقَلاَ"],["وَفِي التَّاءِ نُونٌ سَاكِنٌ حَجَّ فِي صَفَا","كَمَالٍ وَفِي الشُّورَى حَلَا صَفْوُهُ وِلَا"],["وَرَآءِيَ وَٱجۡعَل لِّى وَإِنِّى كِلَاهُمَا","وَرَبِّي وَءَاتَىٰنِي مُضَافَاتُهَا الوُلَى"],["لِحَمْزَةَ فَاضْمُمْ كَسْرَ«هَا» أَهۡلِهِ ٱمۡكُثُواْ","مَعاً، وَافْتَحُوا أَنِّى أَنَا دَائِماً حُلَى"],["وَنَوِّنْ بِهَا وَالنَّازِعَاتِ طُوࣰي ذَكَا","وَفِي ٱخۡتَرۡتُكَ ٱخۡتَرۡنَٰكَ فَازَ، وَثَقَّلَا"],["وَأَنَّا، وَشَامٍ قَطْعُ أَشۡدُدۡ وَضُمَّ فِي ابْـ","ـتِدَا غَيْرِهِ، واضْمُمْ وَأُشۡرِكۡهُ كَلْكَلَا"],["مَعَ الزُّخْرُفِ اقْصُرْ بَعْدَ فَتْحٍ وَسَاكِنٍ","مِهَٰدࣰا ثَوَى، واضْمُمْ سُوࣰى فِي نَدٍ كَلَا"],["وَيَكْسِرُ بَاقِيهِمْ، وَفِيهِ وَفِي سُدًى","مُمَالُ وُقُوفٍ فِي الأُصُولِ تَأَصَّلاَ"],["فَيُسۡحِتَكُمۡ ضَمٌّ وَكَسْرٌ صِحَابُهُمْ","وَتَخْفِيفُ قَالُواْ إِنَّ عَالِمُهُ دَلَا"],["وَهَٰذَۦۡنِ فِي هَٰذَٰنِ حَجَّ وَثِقْلُهُ","دَنَا، فَٱجۡمَعُواْ صِلْ وَافْتَحِ المِيمَ حُوَّلَا"],["وَقُلْ سَٰحِرࣲ سِحۡرࣲ شَفَا، وَتَلَقَّفُ ارْ","فَعِ الجَزْمَ مَعْ أُنْثَى تُخَيَّلُ مُقْبِلَا"],["وَأَنجَيۡتُكُمۡ وَٰعَدتُّكُمۡ مَا رَزَقۡتُكُمۡ","شَفَا، لَا تَخَفۡ بِالقَصْرِ وَالجَزْمِ فُصِّلَا"],["وَحَا فَيَحِلَّ الضَّمُّ فِي كَسْرِهِ رِضاً","وَفِي لَامِ يَحۡلُلۡ عَنْهُ وَافَى مُحَلَّلَا"],["وَفِي مُلۡكِنَا ضَمٌّ شَفَا وَافْتَحُوا أُولِي","نُهىً، وَحَمَلۡنَا ضُمَّ وَاكْسِرْ مُثَقِّلَا"],["كَمَا عِنْدَ حِرْمِيٍّ، وَخَاطَبَ تَبۡصُرُواْ","شَذاً، وَبِكَسْرِ اللاَّمِ تُخۡلِفَهُ حَلاَ"],["دَرَاكِ، وَمَعْ يَاءٍ بِ:نَنفُخُ ضَمُّهُ","وَفِي ضَمِّهِ افْتَحْ عَنْ سِوَى وَلَدِ العَلَا"],["وَبِالقَصْرِ لِلْمَكِّيِّ وَاجْزِمْ فَلَا يَخَفۡ","وَإِنَّكَ لَا فِي كَسْرِهِ صَفْوَةُ العُلَى"],["وَبِالضَّمِّ تَرۡضَىٰ صِفْ رِضاً، تَأۡتِهِمۡ مُؤَنْـ","ـنَثٌ عَنْ أُولِي حِفْظٍ، لَعَلِّي، أَخِي حُلَى"],["وَذِكۡرِي مَعاً إِنِّى مَعاً لِى مَعاً حَشَرۡ","تَنِي، عَيۡنِ، نَفۡسِي، إِنَّنِي، رَأۡسِيَ انْجَلَى"],["وَقُلۡ قَالَ عَنْ شُهْدٍ وَآخِرَهَا عَلاَ","وَقُلْ أَوَلَمۡ لَا وَاوَ دَارِيهِ وَصَّلاَ"],["وَتُسۡمِعُ فَتْحُ الضَّمِّ وَالكَسْرِ غَيْبَةً","سِوَى اليَحْصَبِي، وَٱلصُّمُّ بِالرَّفْعِ وُكِّلَا"],["وَقَالَ بِهِ فِي النَّمْلِ وَالرُّومِ دَارِمٌ","وَمِثۡقَالَ مَعْ لُقْمَانَ بِالرَّفْعِ أُكْمِلَا"],["جُذَٰذًا بِكَسْرِ الضَّمِّ رَاوٍ، وَنُونُهُ","لِيُحۡصِنَكُمۡ صَافَى وَأُنِّثَ عَنْ كِلَا"],["وَسَكَّنَ بَيْنَ الكَسْرِ وَالقَصْرِ صُحْبَةٌ","وَحِرۡمٌ، وَنُـۨجِي احْذِفْ وَثَقِّلْ كَذِي صِلَا"],["وَلِلۡكُتُبِ اجْمَعْ عَنْ شَذاً وَمُضَافُهَا:","مَعِي، مَسَّنِي، إِنِّى، عِبَادِيَ مُجْتَلَى"],["سُكَٰرَىٰ مَعاً سَكۡرَىٰ شَفَا، وَمُحَرَّكٌ","لِيَقۡطَعۡ بِكَسْرِ اللَّامِ كَمْ جِيدُهُ حَلَا"],["لِيُوفُواْ ابْنُ ذَكْوَانٍ لِيَطَّوَّفُواْ لَهُ","لِيَقۡضُواْ سِوَى بَزِّيِّهِمْ نَفَرٌ جَلاَ"],["وَمَعْ فَاطِرَ انْصِبْ لُؤۡلُؤࣰا نَظْمَ أُلْفَةٍ","وَرَفْعَ سَوَآءً غَيْرُ حَفْصٍ تَنَخَّلاَ"],["وَغَيْرُ صِحَابٍ فِي الشَّرِيعَةِ، ثُمَّ وَلۡـ","ـيُوَفُّواْ فَحَرِّكْهُۥ لِشُعْبَةَ أَثْقَلَا"],["فَتَخۡطَفُهُ عَنْ نَافِعٍ مِثْلُهُ، وَقُلْ","مَعاً مَنسِكًا فِي السِّينِ بِالكَسْرِ شُلْشُلَا"],["وَيَدۡفَعُ حَقٌّ بَيْنَ فَتْحَيْهِ سَاكِنٌ","يُدَٰفِعُ، وَالمَضْمُومُ فِي أَذِنَ اعْتَلَى"],["نَعَمْ حَفِظُوا، وَالفَتْحُ فِي تَا يُقَٰتِلُو","نَ عَمَّ عُلاَهُۥ، هُدِّمَتۡ خَفَّ إِذْ دَلَا"],["وَبِصْرِيٌّ اَهۡلَكۡنَـٰ بِتَاءٍ وَضَمِّهَا","يَعُدُّونَ فِيهِ الغَيْبُ شَايَعَ دُخْلُلَا"],["وَفِي سَبَأً حَرْفَانِ مَعْهَا مُعَٰجِزِيـ","ـنَ حَقٌّ بِلاَ مَدٍّ وَفِي الجِيمِ ثَقَّلَا"],["وَالَاوَّلُ مَعْ لُقْمَانَ يَدۡعُونَ غَلَّبُوا","سِوَى شُعْبَةٍ، وَاليَاءُ بَيۡتِيَ جَمَّلَا"],["أَمَٰنَٰتِهِمۡ وَحِّدْ وَفِي سَالَ دَارِياً","صَلَوٰتِهِمُۥ شَافٍ، وَعَظۡمࣰا كَذِي صِلَا"],["مَعَ ٱلۡعَظۡمِ، وَاضْمُمْ وَاكْسِرِ الضَّمَّ حَقُّهُ","بِ:تَنۢبُتُ، وَالمَفْتُوحُ سَيۡنَآءَ ذُلِّلَا"],["وَضَمٌّ وَفَتْحٌ مُنزَلࣰا غَيْرُ شُعْبَةٍ","وَنَوَّنَ تَتۡرࣰا حَقُّهُ، وَاكْسِرِ الوِلَا"],["وَإِنَّ ثَوَى وَالنُّونَ خَفِّفْ كَفَى، وَتَهۡـ","ـجُرُونَ بِضَمٍّ وَاكْسِرِ الضَّمَّ أَجْمَلاَ"],["وَفِي لَامِ لِلَّهِ الأَخِيرَيْنِ حَذْفُهَا","وَفِي الهَاءِ رَفْعُ الجَرِّ عَنْ وَلَدِ العَلَا"],["وَعَٰلِمُ خَفْضُ الرَّفْعِ عَنْ نَفَرٍ، وَفَتْـ","ـحُ شِقۡوَتُنَا وَامْدُدْ وَحَرِّكْهُ شُلْشُلَا"],["وَكَسْرُكَ سُخۡرِيًّا بِهَا وَبِصَادِهَا","عَلَى ضَمِّهِ أَعْطَى شِفَاءً وَأَكْمَلاَ"],["وَفِي إِنَّهُمۡ كَسْرٌ شَرِيفٌ، وَتُرۡجَعُو","نَ فِي الضَّمِّ فَتْحٌ وَاكْسِرِ الجِيمَ وَاكْمُلَا"],["وَفِي قَٰلَ كَمۡ قُلۡ دُونَ شَكٍّ، وَبَعْدَهُ","شَفَا، وَبِهَا يَاءٌ لَعَلِّيَ عَلَّلَا"],["وَحَقٌّ وَفَرَّضۡنَٰ ثَقِيلاً، وَرَأۡفَةࣱ","يُحَرِّكُهُ المَكِّي، وَأَرۡبَعُ أَوَّلَا"],["صِحَابٌ، وَغَيْرُ الحَفْصِ خَٰمِسَةُ الأَخِيـ","ـرُ، أَنۡ غَضِبَ التَّخْفِيفُ وَالكَسْرُ أُدْخِلَا"],["وَيَرْفَعُ بَعْدُ الجَرَّ، يَشۡهَدُ شَائِعٌ","وَغَيۡرِ أُوْلِي بِالنَّصْبِ صَاحِبُهُ كَلاَ"],["وَدُرِّيࣱّ اكْسِرْ ضَمَّهُ حُجَّةً رِضاً","وَفِي مَدِّهِ وَالهَمْزِ صُحْبَتُهُ حَلَا"],["يُسَبِّحُ فَتْحُ البَا كَذَا صِفْ، وَتُوقَدُ الـ","ـمُؤَنَّثُ صِفْ شَرْعاً وَحَقٌّ «تَفَعَّلَا»"],["وَمَا نَوَّنَ البَزِّي سَحَابࣱ وَرَفْعَهُمْ","لَدَى ظُلُمَٰتٍ جَرَّ دَارٍ وَأَوْصَلاَ"],["كَمَا ٱسۡتُخۡلِفَ اضْمُمْهُۥ مَعَ الكَسْرِ صَادِقاً","وَفِي يُبۡدِلَنَّ الخِفُّ صَاحِبُهُ دَلَا"],["وَثَانِي ثَلَٰثُ ارْفَعْ سِوَى صُحْبَةٍ وَقِفْ","وَلَا وَقْفَ قَبْلَ النَّصْبِ إِنْ قُلْتَ أُبْدِلَا"],["وَنَأۡكُلُ مِنۡهَا النُّونُ شَاعَ، وَجَزْمُنَا","وَيَجۡعَلۡ بِرَفْعٍ دَلَّ صَافِيهِ كُمَّلَا"],["وَيَحۡشُرُ يَا دَارٍ عَلاَ، فَنَقُولُ نُو","نُ شَامٍ، وَخَاطِبْ تَسۡتَطِيعُونَ عُمَّلَا"],["وَنُنزِلُ زِدْهُ النُّونَ وَارْفَعْ وَخَفَّ وَٱلۡـ","ـمَلَٰٓئِكَةُ المَرْفُوعُ يُنْصَبُ دُخْلُلَا"],["تَشَقَّقُ خِفُّ الشِّينِ مَعْ قَافَ غَالِبٌ","وَيَأۡمُرُ شَافٍ، وَاجْمَعُوا سُرُجࣰا وِلَا"],["وَلَمۡ يَقۡتِرُواْ اضْمُمْ عَمَّ وَالكَسْرَ ضُمَّ ثِقْ","يُضَٰعَفۡ وَيَخۡلُدۡ رَفْعُ جَزْمٍ كَذِي صِلَا"],["وَوَحَّدَ ذُرِّيَّٰتِنَا حِفْظُ صُحْبَةٍ","وَيَلۡقَوۡنَ فَاضْمُمْهُۥ وَحَرِّكْ مُثَقِّلاَ"],["سِوَى صُحْبَةٍ، وَاليَاءُ: قَوۡمِي وَلَيۡتَنِيَ","وَكَمْ لَوْ وَلَيْتٍ تُورِثُ القَلْبَ أَنْصُلَا"],["وَفِي حَٰذِرُونَ المَدُّ مَا ثُلَّ، فَٰرِهِي","نَ ذَاعَ، وَخَلۡقُ اضْمُمْ وَحَرِّكْ بِهِ العُلَى"],["كَمَا فِي نَدٍ، وَلۡـَٔيۡكَةِ اللَّامُ سَاكِنٌ","مَعَ الهَمْزِ وَاخْفِضْهُۥ وَفِي صَادَ غَيْطَلَا"],["وَفِي نَزَلَ التَّخْفِيفُ وَٱلرُّوحُ وَٱلۡأَمِيـ","ـنُ رَفْعُهُمَا عُلْوٌ سَمَا وَتَبَجَّلاَ"],["وَأَنِّثْ تَكُنۡ لِلْيَحْصَبِي وَارْفَعَ ايَةً","وَفَا فَتَوَكَّلۡ وَاوُ ظَمْآنِهِ حَلَا"],["وَيَا: خَمْسِ أَجۡرِي مَعْ عِبَادِي وَلِي، مَعِي","مَعاً مَعْ أَبِى، إِنِّى مَعاً، رَبِّيَ انْجَلَى"],["شِهَابِ بِنُونٍ ثِقْ، وَقُلْ يَأۡتِيَنَّنِي","دَنَا، مَكُثَ افْتَحْ ضَمَّةَ الكَافِ نَوْفَلَا"],["مَعاً سَبَأَ افْتَحْ دُونَ نُونٍ حِمَى هُدىً","وَسَكِّنْهُ وَانْوِ الوَقْفَ زَهْراً وَمَنْدَلَا"],["أَلَا يَسۡجُدُواْ رَاوٍ وَقِفْ مُبْتَلىً: أَلَا","وَيَٰ وَاسۡجُدُواْ وَابْدَأْهُ بِالضَّمِّ مُوصِلَا"],["أَرَادَ: أَلَا يَا هَؤُلَاءِ اسْجُدُوا، وَقِفْ","لَهُ قَبْلَهُ، وَالغَيْرُ أَدْرَجَ مُبْدِلَا"],["وَقَدْ قِيلَ: مَفْعُولاً، وَ«أَنْ» أَدْغَمُوا بِ«لَ»ا","وَلَيْسَ بِمَقْطُوعٍ فَقِفْ يَسۡجُدُواْ وَلَا"],["وَيُخۡفُونَ خَاطِبْ يُعۡلِنُونَ عَلَا رِضاً","تُمِدُّونَنِ الإِدْغَامُ فَازَ فَثَقَّلَا"],["مَعَ ٱلسُّؤۡقِ سَأۡقَيۡهَا وَسُؤۡقِ اهْمِزُوا زَكَا","وَوَجْهٌ بِهَمْزٍ بَعْدَهُ الوَاوُ وُكِّلَا"],["نَقُولَنَّ فَاضْمُمْ رَابِعاً وَنُبَيِّتَنۡـ","ـنَهُۥ وَمَعاً فِي النُّونِ خَاطِبْ شَمَرْدَلَا"],["وَمَعْ فَتْحِ أَنَّ ٱلنَّاسَ مَا بَعْدَ مَكۡرِهِمۡ","لِكُوفٍ، وَأَمَّا يُشۡرِكُونَ نَدٍ حَلَا"],["وَشَدِّدْ وَصِلْ وَامْدُدْ بَلِ ٱدَّٰرَكَ الَّذِي","ذَكَا، قَبْلَهُ يَذَّكَّرُونَ لَهُ حُلَا"],["بِهَٰدِي مَعاً تَهۡدِي فَشَا ٱلۡعُمۡيَ نَاصِباً","وَبِاليَا لِكُلٍّ قِفْ وَفِي الرُّومِ شَمْلَلَا"],["وَءَاتُوهُ فَاقْصُرْ وَافْتَحِ الضَّمَّ عِلْمُهُ","فَشَا، يَفۡعَلُونَ الغَيْبُ حَقٌّ لَهُ وَلَا"],["وَمَالِى وَأَوۡزِعۡنِي وَإِنِّى كِلَاهُمَا","لِيَبۡلُوَنِى اليَاءَاتُ فِي قَوْلِ مَنْ بَلَا"],["وَفِي نُرِيَ الفَتْحَانِ مَعْ أَلِفٍ وَيَا","ئِهِ وَثَلاَثٌ رَفْعُهَا بَعْدُ شُكِّلَا"],["وَحُزۡنًا بِضَمٍّ مَعْ سُكُونٍ شَفَا، وَيَصۡـ","ـدُرَ اضْمُمْ وَكَسْرُ الضَّمِّ ظَامِيهِ أَنْهَلَا"],["وَجِذۡوَةࣲ اضْمُمْ فُزْتَ وَالفَتْحَ نَلْ، وَصُحْـ","ـبَةٌ كَهْفُ ضَمِّ ٱلرَّهۡبِ وَاسْكِنْهُ ذُبَّلَا"],["يُصَدِّقُنِي ارْفَعْ جَزْمَهُ فِي نُصُوصِهِ","وَقُلْ قَالَ مُوسَيٰ وَاحْذِفِ الوَاوَ دُخْلُلَا"],["نَمَى نَفَرٌ بِالضَّمِّ وَالفَتْحِ يُرۡجَعُو","نَ، سِحۡرَانِ ثِقْ فِي سَٰحِرَانِ فَتُقْبَلَا"],["وَيُجۡبَيٰ خَلِيطٌ، يَعۡقِلُونَ حَفِظْتُهُ","وَفِي خُسِفَ الفَتْحَيْنِ حَفْصٌ تَنَخَّلَا"],["وَعِندِي وَ«ذُو الثُّنْيَا» وَإِنِّيَ أَرْبَعٌ","لَعَلِّى مَعاً، رَبِّي ثَلاَثٌ، مَعِي اعْتَلَى"],["تَرَوۡاْ صُحْبَةٌ خَاطِبْ، وَحَرِّكْ وَمُدَّ فِي ٱلنۡـ","ـنَشَآءَةِ حَقّاً وَهْوَ حَيْثُ تَنَزَّلَا"],["مَوَدَّةٌ المَرْفُوعُ حَقُّ رُوَاتِهِ","وَنَوِّنْهُ وَانْصِبْ بَيۡنَكُمۡ عَمَّ صَنْدَلَا"],["وَيَدۡعُونَ نَجْمٌ حَافِظٌ، وَمُوَحِّدٌ","هُنَا ءَايَتࣱ مِّن رَّبِّهِۦ صُحْبَةٌ دَلَا"],["وَفِي وَيَقُولُ اليَاءُ حِصْنٌ، وَيُرۡجَعُو","نَ صَفْوٌ وَحَرْفُ الرُّومِ صَافِيهِ حُلِّلَا"],["وَذَاتُ ثَلاَثٍ سُكِّنَتْ بَا نُبَوِّئَنۡـ","ـنَ مَعْ خِفِّهِ وَالهَمْزُ بِاليَاءِ شَمْلَلَا"],["وَإِسْكَانَ وَلۡ فَاكْسِرْ كَمَا حَجَّ جَا نَدىً","وَرَبِّي، عِبَادِي، أَرۡضِيَ اليَا بِهَا انْجَلَى"],["وَعَٰقِبَةُ الثَّانِي سَمَا، وَبِنُونِهِ","يُذِيقَ زَكَا، لِلۡعَٰلَمِينَ اكْسِرُوا عُلَى"],["لِتُرۡبُواْ خِطَابٌ ضُمَّ وَالوَاوُ سَاكِنٌ","أَتَى، وَاجْمَعُوا ءَاثَٰرِ كَمْ شَرَفاً عَلَا"],["وَيَنفَعُ كُوفِيٌّ وَفِي الطَّوْلِ حِصْنُهُ.","وَرَحۡمَةࣱ ارْفَعْ فَائِزاً وَمُحَصِّلاَ"],["وَيَتَّخِذُ المَرْفُوعُ غَيْرُ صِحَابِهِمْ","تُصَٰعِرۡ بِمَدٍّ خَفَّ إِذْ شَرْعُهُ حَلاَ"],["وَفِي نِعۡمَةࣰ حَرِّكْ وَذُكِّرَ هَاؤُهَا","وَضُمَّ وَلَا تَنْوِينَ عَنْ حُسْنٍ اعْتَلَى"],["سِوَى ابْنِ العَلَا وَٱلۡبَحۡرُ. أُخۡفِي سُكُونُهُ","فَشَا، خَلۡقَهُ التَّحْرِيكُ حِصْنٌ تَطَوَّلَا"],["لِمَا صَبَرُواْ فَاكْسِرْ وَخَفِّفْ شَذاً. وَقُلْ","بِمَا يَعۡمَلُونَ اثْنَانِ عَنْ وَلَدِ العَلاَ"],["وَبِالهَمْزِ كُلُّ ٱلَّـٰٓيِٕ وَاليَاءِ بَعْدَهُ","ذَكَا وَبِيَاءٍ سَاكِنٍ حَجَّ هُمَّلاَ"],["وَكَاليَاءِ مَكْسُوراً لِوَرْشٍ وَعَنْهُمَا","وَقِفْ مُسْكِناً وَالهَمْزُ زَاكِيهِ بُجِّلَا"],["وَتَظَّٰهَرُونَ اضْمُمْهُ وَاكْسِرْ لِعَاصِمٍ","وَفِي الهَاءِ خَفِّفْ وَامْدُدِ الظَّاءَ ذُبَّلاَ"],["وَخَفَّفَهُ ثَبْتٌ وَفِي «قَدْ سَمِعْ» كَمَا","هُنَا وَهُنَاكَ الظَّاءُ خُفِّفَ نَوْفَلاَ"],["وَحَقُّ صِحَابٍ قَصْرُ وَصْلِ ٱلظُّنُونَا۠ وَٱلرۡ","رَسُولَا۠ ٱلسَّبِيلَا۠ وَهْوَ فِي الوَقْفِ فِي حُلَى"],["مَقَامَ لِحَفْصٍ ضُمَّ وَالثَّانِ عَمَّ فِي الدْ","دُخَانِ، وَءَاتَوۡهَا عَلَى المَدِّ ذُو حَلَا"],["وَفِي الكُلِّ ضَمُّ الكَسْرِ فِي إِسۡوَةٍ نَدىً","وَقَصْرُ كِفَا حَقٍّ يُضَٰعَفۡ مُثَقَّلاَ"],["وَبِاليَا وَفَتْحِ العَيْنِ، رَفْعُ ٱلۡعَذَابِ حِصْـ","ـنُ حُسْنٍ، وَيَعۡمَلۡ، يُؤۡتِ بِاليَاءِ شَمْلَلَا"],["وَقَرۡنَ افْتَحِ اذْ نَصُّوا، يَكُونَ لَهُ ثَرىً","يَحِلُّ سِوَى البِصْرِي، وَخَاتِمَ وُكِّلَا"],["بِفَتْحٍ نَمَى، سَادَٰتِنَا اجْمَعْ بِكَسْرِهِ","كَفَى، وَكَثِيرࣰا نُقْطَةٌ تَحْتُ نُفِّلَا"],["وَعَٰلِمِ قُلْ عَلَّٰمِ شَاعَ وَرَفْعُ خَفْـ","ـضِهِ عَمَّ، مِن رِّجۡزٍ أَلِيمࣲ مَعاً وِلَا"],["عَلَى رَفْعِ خَفْضِ المِيمِ دَلَّ عَلِيمُهُ","وَيَخۡسِفۡ، يَشَأۡ، يُسۡقِطۡ بِهَا اليَاءُ شُمِّلَا"],["وَفِي ٱلرِّيحِ رَفْعٌ صَحَّ، مِنسَاتَهُۥ سُكُو","نُ هَمْزَتِهِ مَاضٍ وَأَبْدِلْهُ إِذْ حَلاَ"],["مَسَٰكِنِهِمۡ سَكِّنْهُ وَاقْصُرْ عَلَى شَذاً","وَفِي الكَافِ فَافْتَحْ عَالِماً فَتُبَجَّلَا"],["نُجَٰزِي بِيَاءٍ وَافْتَحِ الزَّايَ وَٱلۡكَفُو","رُ رَفْعٌ سَمَا كَمْ صَابَ، أُكۡلٍ أَضِفْ حُلَى"],["وَحَقُّ لِواً بَٰعِدۡ بِقَصْرٍ مُشَدَّداً","وَصَدَّقَ لِلْكُوفِيِّ جَاءَ مُثَقَّلاَ"],["وَفُزِّعَ فَتْحُ الضَّمِّ وَالكَسْرِ كَامِلٌ","وَمَنۡ أُذِنَ اضْمُمْ حُلْوَ شَرْعٍ تَسَلْسَلَا"],["وَفِي ٱلۡغُرۡفَتِ التَّوْحِيدُ فَازَ، وَيُهْمَزُ ٱلتۡـ","ـتَنَاوُشُ حُلْواً صُحْبَةً وَتَوَصُّلاَ"],["وَأَجۡرِي، عِبَادِي، رَبِّيَ اليَا مُضَافُهَا.","وَقُلْ رَفْعُ غَيۡرِ ٱللَّهِ بِالخَفْضِ شُكِّلَا"],["وَيُجۡزَيٰ بِيَاءٍ ضُمَّ مَعْ فَتْحِ زَايِهِ","وَكُلُّ بِهِ ارْفَعْ وَهْوَ عَنْ وَلَدِ العَلَا"],["وَفِي ٱلسَّيِّيِٕ المَخْفُوضِ هَمْزاً سُكُونُهُ","فَشَا، بَيِّنَٰتࣲ قَصْرُ حَقِّ فَتىً عَلاَ"],["وَتَنزِيلُ نَصْبُ الرَّفْعِ كَهْفُ صِحَابِهِ","وَخَفِّفْ فَعَزَّزۡنَا لِشُعْبَةَ مُحْمِلاَ"],["وَمَا عَمِلَتۡهُۥ يَحْذِفُ الهَاءَ صُحْبَةٌ","وَوَٱلۡقَمَرَ ارْفَعْهُۥ سَمَا وَلَقَدْ حَلاَ"],["وَخَا يَخۡصِمُونَ افْتَحْ سَمَا لُذْ وَأَخْفِ حُلْـ","ـوَ بَرٍّ وَسَكِّنْهُۥ وَخَفِّفْ فَتُكْمِلَا"],["وَسَاكِنَ شُغۡلࣲ ضُمَّ ذِكْراً، وَكَسْرُ فِي","ظِلَٰلٍ بِضَمٍّ وَاقْصُرِ اللَّامَ شُلْشُلَا"],["وَقُلْ جُبُلࣰا مَعْ كَسْرِ ضَمَّيْهِ ثِقْلُهُ","أَخُو نُصْرَةٍ وَاضْمُمْ وَسَكِّنْ كَذِي حَلَا"],["وَنَنكُسۡهُ فَاضْمُمْهُۥ وَحَرِّكْ لِعَاصِمٍ","وَحَمْزَةَ وَاكْسِرْ عَنْهُمَا الضَّمَّ أَثْقَلاَ"],["لِيُنذِرَ دُمْ غُصْناً وَالَاحْقَافُ هُمْ بِهَا","بِخُلْفٍ هَدَى، مَالِي وَإِنِّي مَعاً حُلَى"],["وَصَفࣰّا وَزَجۡرࣰا، ذِكۡرًا اَدْغَمَ حَمْزَةٌ","وَذَرۡوࣰا بِلاَ رَوْمٍ بِهَا التَّا فَثَقَّلاَ"],["وَخَلَّادُهُمْ بِالخُلْفِ فَٱلۡمُلۡقِيَٰتِ فَٱلۡـ","ـمُغِيرَٰتِ فِي ذِكۡرًا وَصُبۡحࣰا فَحَصِّلَا"],["بِزِينَةِ نَوِّنْ فِي نَدٍ وَٱلۡكَوَاكِبَ انْـ","ـصِبُوا صَفْوَةً، يَسَّمَّعُونَ شَذاً عَلاَ"],["بِثِقْلَيْهِ، وَاضْمُمْ تَا عَجِبۡتُ شَذاً، وَسَا","كِنٌ مَعاً اَوۡ ءَابَآؤُنَا كَيْفَ بَلَّلَا"],["وَفِي يُنزِفُونَ الزَّايَ فَاكْسِرْ شَذاً وَقُلْ","فِي الُاخْرَى ثَوَى، وَاضْمُمْ يُزِفُّونَ فَاكْمُلَا"],["وَمَاذَا تَرَىٰ بِالضَّمِّ وَالكَسْرِ شَائِعٌ","وَإِلۡيَاسَ حَذْفُ الهَمْزِ بِالخُلْفِ مُثِّلَا"],["وَغَيْرُ صِحَابٍ رَفْعُهُ ٱللَّهُ رَبُّكُمۡ","وَرَبُّ، وَإِلۡ يَاسِينَ بِالكَسْرِ وُصِّلاَ"],["مَعَ القَصْرِ مَعْ إِسْكَانِ كَسْرٍ دَنَا غِنىً","وَإِنِّى وَ«ذُو الثُّنْيَا» وَأَنِّىَ أُجْمِلاَ"],["وَضَمُّ فُوَاقࣲ شَاعَ، خَالِصَةࣲ أَضِفْ","لَهُ الرُّحْبُ، وَحِّدْ عَبۡدَنَا قَبْلُ دُخْلُلَا"],["وَفِي يُوعَدُونَ دُمْ حُلىً وَبِقَافَ دُمْ","وَثَقَّلَ غَسَّاقࣰا مَعاً شَائِدٌ عُلَى"],["وَءَاخَرُ لِلْبِصْرِي بِضَمٍّ وَقَصْرِهِ","وَوَصْلُ ٱتَّخَذۡنَٰهُمۡ حَلَا شَرْعُهُ وِلاَ"],["وَفَٱلۡحَقُّ فِي نَصْرٍ، وَخُذْ يَاءَ لِى مَعاً","وَإِنِّى وَبَعۡدِي، مَسَّنِي، لَعۡنَتِي إِلَىٰ"],["أَمَنۡ خَفَّ حِرْمِيٌّ فَشَا، مَدَّ سَٰلِمࣰا","مَعَ الكَسْرِ حَقٌّ، عَبۡدَهُ اجْمَعْ شَمَرْدَلَا"],["وَقُلْ كَٰشِفَٰتࣱ مُمۡسِكَٰتࣱ مُنَوِّناً","وَرَحۡمَتِهِۦ مَعْ ضُرِّهِ النَّصْبَ حُمِّلَا"],["وَضُمَّ قَضَيٰ وَاكْسِرْ وَحَرِّكْ وَبَعْدُ رَفْ","عُ شَافٍ، مَفَازَٰتِ اجْمَعُوا شَاعَ صَنْدَلاَ"],["وَزِدْ تَأۡمُرُونِى النُّونَ كَهْفاً وَعَمَّ خِفْـ","ـفُهُ، فُتِّحَتۡ خَفِّفْ وَفِي النَّبَا العُلَى"],["لِكُوفٍ، وَخُذْ يَا تَأۡمُرُونِى، أَرَادَنِى","وَإِنِّى مَعاً مَعْ يَٰ عِبَادِي مُحَصِّلاَ"],["وَتَدۡعُونَ خَاطِبْ إِذْ لَوَى، هَاءُ مِنۡهُمُۥ","بِكَافٍ كَفَى، أَوۡ أَنۡ زِدِ الهَمْزَ ثُمَّلَا"],["وَسَكِّنْ لَهُمْ، وَاضْمُمْ بِ:يَظۡهَرَ وَاكْسِرَنْ","وَرَفْعَ ٱلۡفَسَادَ انْصِبْ إِلَى عَاقِلٍ حَلَا"],["فَأَطَّلِعَ ارْفَعْ غَيْرَ حَفْصٍ، وَقَلۡبِ نَوْ","وِنُوا مِنْ حَمِيدٍ، أَدۡخِلُواْ نَفَرٌ صِلَا"],["عَلَى الوَصْلِ وَاضْمُمْ كَسْرَهُ، يَتَذَكَّرُو","نَ كَهْفٌ سَمَا، وَاحْفَظْ مُضَافَاتِهَا العُلَى"],["ذَرُونِيَ وَٱدۡعُونِي وَإِنِّي ثَلَاثَةٌ","لَعَلِّى وَفِي مَالِى وَأَمۡرِيَ مَعْ إِلَىٰ"],["وَإِسْكَانُ نَحۡسَاتࣲ بِهِ كَسْرُهُ ذَكَا","وَقَوْلُ مُمِيلِ السِّينِ لِلَّيْثِ أُخْمِلاَ"],["وَنَحۡشُرُ يَاءٌ ضُمَّ مَعْ فَتْحِ ضَمِّهِ","وَأَعۡدَآءُ خُذْ، وَالجَمْعُ عَمَّ عَقَنْقَلَا"],["لَدَى ثَمَرَٰتࣲ، ثُمَّ يَا شُرَكَآءِيَ ال","مُضَافُ وَيَا رَبِّي بِهِ الخُلْفُ بُجِّلَا"],["وَيُوحَيٰ بِفَتْحِ الحَاءِ دَانَ، وَيَفۡعَلُو","نَ غَيْرُ صِحَابٍ، يَعۡلَمُ ارْفَعْ كَمَا اعْتَلَى"],["بِمَا كَسَبَتۡ لَا فَاءَ عَمَّ، كَبِيرَ فِي","كَبَٰٓئِرَ فِيهَا ثُمَّ فِي النَّجْمِ شَمْلَلَا"],["وَيُرۡسِلُ فَارْفَعْ مَعْ فَيُوحِي مُسَكِّناً","أَتَانَا. وَإِن كُنتُمۡ بِكَسْرٍ شَذَا العُلَى"],["وَيَنشَؤُاْ فِي ضَمٍّ وَثِقْلٍ صِحَابُهُ","عِبَٰدُ بِرَفْعِ الدَّالِ فِي عِندَ غَلْغَلَا"],["وَسَكِّنْ وَزِدْ هَمْزاً كَوَاوٍ أَ۟شۡهِدُواْ","أَمِيناً وَفِيهِ المَدُّ بِالخُلْفِ بَلَّلاَ"],["وَقُلۡ قَٰلَ عَنْ كُفْءٍ، وَسَقۡفࣰا بِضَمِّهِ","وَتَحْرِيكِهِ بِالضَّمِّ ذَكَّرَ أَنْبَلاَ"],["وَحُكْمُ صِحَابٍ قَصْرُ هَمْزَةِ جَآءَنَا","وَأَسۡوِرَةࣱ سَكِّنْ وَبِالقَصْرِ عُدِّلَا"],["وَفِي سُلُفࣰا ضَمَّا شَرِيفٍ، وَصَادُهُ","يَصُدُّونَ كَسْرُ الضَّمِّ فِي حَقِّ نَهْشَلَا"],["ءَأَٰلِهَتࣱ كُوفٍ يُحَقِّقُ ثَانِياً","وَقُلْ أَلِفاً لِلْكُلِّ ثَالِثاً اُبْدِلَا"],["وَفِي تَشۡتَهِيهِۦ تَشۡتَهِي حَقُّ صُحْبَةٍ","وَفِي يُرۡجَعُونَ الغَيْبُ شَايَعَ دُخْلُلاَ"],["وَفِي قِيلَهُ اكْسِرْ وَاكْسِرِ الضَّمَّ بَعْدُ فِي","نَصِيرٍ، وَخَاطِبْ تَعۡلَمُونَ كَمَا انْجَلَى"],["بِ:تَحۡتِي، عِبَادِي اليَا. وَيَغۡلِي دَنَا عُلىً","وَرَبُّ ٱلسَّمَٰوَٰتِ اخْفِضُوا الرَّفْعَ ثُمَّلَا"],["وَضَمَّ ٱعۡتِلُوهُ اكْسِرْ غِنىً، أَنَّكَ افْتَحُوا","رَبِيعاً، وَقُلْ إِنِّى وَلِى اليَاءَ حُمِّلَا"],["مَعاً رَفْعُ ءَايَٰتٍ عَلَى كَسْرِهِ شَفَا","وَ«إِنَّ» وَ«فِي» أَضْمِرْ بِتَوْكِيدٍ اُوِّلَا"],["لِيَجۡزِيَ يَا نَصٍّ سَمَا، وَغِشَٰوَةࣰ","بِهِ الفَتْحُ وَالإِسْكَانُ وَالقَصْرُ شُمِّلَا"],["وَوَٱلسَّاعَةُ ارْفَعْ غَيْرَ حَمْزَةَ. حُسۡنًا الـ","ـمُحَسَّنُ إِحۡسَٰنًا لِكُوفٍ تَحَوَّلَا"],["وَغَيْرُ صِحَابٍ أَحۡسَنُ ارْفَعْ، وَقَبْلَهُ","وَبَعْدُ بِيَاءٍ ضُمَّ فِعْلاَنِ وُصِّلاَ"],["وَقُلْ عَنْ هِشَامٍ أَدْغَمُوا تَعِدَانِنِي","يُوَفِّيَهُمۡ بِاليَا لَهُ حَقُّ نَهْشَلاَ"],["وَقُلْ لَا يُرَىٰ بِالغَيْبِ وَاضْمُمْ، وَبَعْدَهُ","مَسَٰكِنُهُمۡ بِالرَّفْعِ فَاشِيهِ نُوِّلَا"],["وَيَاءُ وَلَٰكِنِّي وَيَا تَعِدَانِنِي","وَإِنِّي وَأَوۡزِعۡنِي بِهَا خُلْفُ مَنْ تَلاَ"],["وَبِالضَّمِّ وَاقْصُرْ وَاكْسِرِ التَّاءَ قَٰتَلُواْ","عَلَى حُجَّةٍ، وَالقَصْرُ فِي ءَاسِنࣲ دَلَا"],["وَفِي ءَانِفًا خُلْفٌ هَدَى، وَبِضَمِّهِمْ","وَكَسْرٍ وَتَحْرِيكٍ وَأُمۡلِىَ حُصِّلاَ"],["وَأَسۡرَارَهُمۡ فَاكْسِرْ صِحَاباً، وَيَبۡلُوَنۡـ","ـنَكُمۡ، يَعۡلَمَ اليَا صِفْ وَيَبۡلُوَاْ وَاقْبَلَا."],["وَفِي يُؤۡمِنُواْ حَقٌّ وَبَعْدُ ثَلَاثَةٌ","وَفِي يَاءِ يُؤۡتِيهِۦ غَدِيرٌ تَسَلْسَلاَ"],["وَبِالضَّمِّ ضُرًّا شَاعَ، وَالكَسْرُ عَنْهُمَا","بِلاَمِ كَلَٰمَ ٱللَّهِ وَالقَصْرُ وُكِّلَا"],["بِمَا يَعۡمَلُونَ حَجَّ، حَرَّكَ شَطۡـَٔهُ","دُعَا مَاجِدٍ، وَاقْصُرْ فَـَٔازَرَهُۥ مُلاَ."],["وَفِي يَعۡمَلُونَ دُمْ. يَقُولُ بِيَاءٍ اِذْ","صَفَا، وَاكْسِرُوا إِدۡبَٰرَ إِذْ فَازَ دُخْلُلَا"],["وَبِاليَا يُنَادِۦ قِفْ دَلِيلاً بِخُلْفِهِ.","وَقُلْ مِثۡلُ مَا بِالرَّفْعِ شَمَّمَ صَنْدَلَا"],["وَفِي ٱلصَّعۡقَةِ اقْصُرْ مُسْكِنَ العَيْنِ رَاوِياً","وَقَوۡمِ بِخَفْضِ المِيمِ شَرَّفَ حُمَّلَا."],["وَبَصْرٍ وَأَتۡبَعۡنَٰ بِ:وَٱتَّبَعَتۡ، وَمَاَۜ","أَلِـتۡنَــٰــــــــ اكْسِرُوا دِنْيــــــاً، وَإِنَّ افْتَحُوا الجَلاَ"],["رِضاً، يُصۡعَقُونَ اضْمُمْهُ كَمْ نَصَّ، وَٱلۡمُصَۜيۡـ","ـطِرُونَ لِسَانٌ عَابَ بِالخُلْفِ زُمَّلَا"],["وَصَادٌ كَزَايٍ قَامَ بِالخُلْفِ ضَبْعُهُ.","وَكَذَّبَ يَرْوِيهِۦ هِشَامٌ مُثَقَّلاَ"],["تُمَٰرُونَهُۥ تَمۡرُونَهُۥ وَافْتَحُوا شَذاً","مَنَوٰٓءَةَ لِلْمَكِّي زِدِ الهَمْزَ وَاحْفِلاَ"],["وَيَهْمِزُ ضِئۡزَىٰ. خُشَّعًا خَٰشِعًا شَفَا","حَمِيداً، وَخَاطِبْ تَعۡلَمُونَ فَطِبْ كَلاَ"],["وَوَٱلۡحَبُّ ذُو ٱلرَّيۡحَانُ رَفْعُ ثَلَاثِهَا","بِنَصْبٍ كَفَى وَالنُّونُ بِالخَفْضِ شُكِّلَا"],["وَيَخۡرُجُ فَاضْمُمْ وَافْتَحِ الضَّمَّ إِذْ حَمَى","وَفِي ٱلۡمُنشَـَٔاتُ الشِّينَ بِالكَسْرِ فَاحْمِلَا"],["صَحِيحاً بِخُلْفٍ، يَفۡرُغُ اليَاءُ شَائِعٌ","شُوَاظࣱ بِكَسْرِ الضَّمِّ مَكِّيُّهُمْ جَلَا"],["وَرَفْعَ نُحَاسࣲ جَرَّ حَقٌّ، وَكَسْرَ مِيـ","ـمِ يَطۡمِثۡ فِي الُاولَى ضُمَّ تُهْدَى وَتُقْبَلَا"],["وَقَالَ بِهِ لِلَّيْثِ فِي الثَّانِ وَحْدَهُ","شُيُوخٌ، وَنَصَّ اللَّيْثُ بِالضَّمِّ الَاوَّلَا"],["وَقَوْلُ الكِسَائِي: ضُمَّ أَيَّهُمَا تَشَا","وَجِيهٌ، وَبَعْضُ المُقْرِئِينَ بِهِ تَلاَ"],["وَآخِرَهَا يَا ذِي ٱلۡجَلَٰلِ ابْنُ عَامِرٍ","بِوَاوٍ وَرَسْمُ الشَّامِ فِيهِ تَمَثَّلاَ"],["وَحُورٌ وَعِينࣱ خَفْضُ رَفْعِهِمَا شَفَا","وَعُرۡبًا سُكُونُ الضَّمِّ صُحِّحَ فَاعْتَلَى"],["وَخِفُّ قَدَرۡنَا دَارَ، وَانْضَمَّ شَرۡبَ فِي","نَدَى الصَّفْوِ، وَاسْتِفْهَامُ إِنَّا صَفاً وِلَا"],["بِمَوۡقِعِ بِالإِسْكَانِ وَالقَصْرِ شَائِعٌ.","وَقَدۡ أُخِذَ اضْمُمْ وَاكْسِرِ الخَاءَ حُوَّلَا"],["وَمِيثَٰقُكُمۡ عَنْهُۥ، وَكُلࣱّ كَفَى، وَأَنـ","ـظِرُونَا بِقَطْعٍ وَاكْسِرِ الضَّمَّ فَيْصَلَا"],["وَيُؤۡخَذُ غَيْرُ الشَّامِ، مَا نَزَلَ الخَفِيـ","ـفُ إِذْ عَزَّ، وَ«الصَّادَانِ» مِنْ بَعْدُ دُمْ صِلَا"],["وَءَاتَىٰكُمُۥ فَاقْصُرْ حَفِيظاً، وَقُلْ هُوَ ٱلۡـ","ـغَنِيُّ: هُوَ احْذِفْ عَمَّ وَصْلًا مُوَصَّلَا"],["وَفِي يَتَنَٰجَوۡنَ اقْصُرِ النُّونَ سَاكِناً","وَقَدِّمْهُ وَاضْمُمْ جِيمَهُ فَتُكَمِّلَا"],["وَكَسْرَ ٱنشِزُواْ فَاضْمُمْ مَعاً صَفْوُ خُلْفِهِ","عُلىً عَمَّ، وَامْدُدْ فِي ٱلۡمَجَـٰلِسِ نَوْفَلَا"],["وَفِي رُسُلِي اليَا. يُخۡرِبُونَ الثَّقِيلَ حُزْ","وَمَعْ دُولَةࣱ أَنِّثْ تَكُونَ بِخُلْفِ لَا"],["وَكَسْرُ جِــــــدَٰرٍ ضُمَّ وَالفَتْحُ وَاقْصُرُوا","ذَوِي إِسْوَةٍ، إِنِّى بِيَاءٍ تَوَصَّلاَ."],["وَيُفۡصَلُ فَتْحُ الضَّمِّ نَصٌّ وَصَادُهُ","بِكَسْرٍ ثَوَى وَالثِّقْلُ شَافِيهِ كَمَّلَا"],["وَفِي تُمۡسِكُواْ ثِقْلٌ حَلاَ. وَمُتِمُّ لَا","تُنَوِّنْهُ وَاخْفِضْ نُورَهُ عَنْ شَذاً دَلَا"],["وَلِلَّهِ زِدْ لَاماً وَأَنصَارَ نَوِّنَنْ","سَمَا، وَتُنَجِّيكُمۡ عَنِ الشَّامِ ثُقِّلاَ"],["وَبَعۡدِي وَأَنصَارِي بِيَاءِ إِضَافَةٍ.","وَخُشۡبࣱ سُكُونُ الضَّمِّ زَادَ رِضاً حَلَا"],["وَخَفَّ لَوَوۡاْ إِلْفاً، بِمَا يَعۡمَلُونَ صِفْ","أَكُونَ بِوَاوٍ وَانْصِبُوا الجَزْمَ حُفَّلَا."],["وَبَٰلِغُ لَا تَنْوِينَ مَعْ خَفْضِ أَمۡرِهِ","لِحَفْصٍ. وَبِالتَّخْفِيفِ عَرَّفَ رُفِّلَا"],["وَضَمَّ نَصُوحًا شُعْبَةٌ. مِن تَفَوُّتࣲ","عَلَى القَصْرِ وَالتَّشْدِيدِ شَقَّ تَهَلُّلاَ"],["وَءَامِنتُمُۥ فِي الهَمْزَتَيْنِ أُصُولُهُ","وَفِي الوَصْلِ الُاولَى قُنْبُلٌ وَاواً اَبْدَلَا"],["فَسُحۡقࣰا سُكُوناً ضُمَّ مَعْ غَيْبِ يَعۡلَمُو","نَ مَنۡ رُضْ، مَعِي بِاليَا وَأَهۡلَكَنِي انْجَلَى"],["وَضَمُّهُمُۥ فِي يُزۡلِقُونَكَ خَالِدٌ.","وَمَن قَبۡلَهُۥ فَاكْسِرْ وَحَرِّكْ رِوىً حَلاَ"],["وَيَخۡفَيٰ شِفَاءٌ، مَالِيَهۡ مَاهِيَهۡ فَصِلْ","وَسُلۡطَٰنِيَهۡ مِنْ دُونِ هَاءٍ فَتُوصَلَا"],["وَيَذَّكَّرُونَ يُؤۡمِنُونَ مَقَالُهُ","بِخُلْفٍ لَهُ دَاعٍ. وَيَعۡرُجُ رُتِّلاَ"],["وَسَالَ بِهَمْزٍ غُصْنُ دَانٍ وَغَيْرُهُمْ","مِنَ الهَمْزِ أَوْ مِنْ وَاوٍ اَوْ يَاءٍ اَبْدَلَا"],["وَنَزَّاعَةࣱ فَارْفَعْ سِوَى حَفْصِهِمْ، وَقُلْ","شَهَـٰدَتِهِمۡ بِالجَمْعِ حَفْصٌ تَقَبَّلاَ"],["إِلَىٰ نُصُبࣲ فَاضْمُمْ وَحَرِّكْ بِهِ عُلَى","كِرَامٍ. وَقُلْ وَدࣰّا بِهِ الضَّمُّ أُعْمِلاَ"],["دُعَـــــآءِى وَإِنِّى ثُمَّ بَيۡتِي مُضَافُهَــــا.","مَعَ الوَاوِ فَافْتَحْ إِنَّ كَمْ شَرَفاً عَلاَ"],["وَعَنْ كُلِّهِمْ أَنَّ ٱلۡمَسَٰجِدَ فَتْحُهُ","وَفِي إِنَّهُۥ لَمَّا بِكَسْرٍ صُوَى العُلَى"],["وَيَسۡلُكۡهُ يَا كُوفٍ، وَفِي قَٰلَ إِنَّمَا","هُنَا قُلۡ فَشَا نَصّاً وَطَابَ تَقَبُّلاَ"],["وَقُلْ لِبَدࣰا فِي كَسْرِهِ الضَّمُّ لَازِمٌ","بِخُلْفٍ، وَيَا رَبِّي مُضَافٌ تَجَمَّلَا."],["وَوَطۡـࣰٔا وِطَآءࣰ فَاكْسِرُوهُ كَمَا حَكَوْا","وَرَبُّ بِخَفْضِ الرَّفْعِ صُحْبَتُهُ كَلَا"],["وَثَا ثُلُثِهۡ فَانْصِبْ وَفَا نِصۡفِهِۦ ظُبىً","وَثُلۡثَيۡ سُكُونُ الضَّمِّ لَاحَ وَجَمَّلاَ."],["وَوَٱلرِّجۡزَ ضَمَّ الكَسْرَ حَفْصٌ، إِذَا قُلِ اذۡ","وَأَدۡبَرَ فَاهْمِزْهُۥ وَسَكِّنْ عَنِ اجْتِلاَ"],["فَبَادِرْ، وَفَا مُسۡتَنفِرَهۡ عَمَّ فَتْحُهُ","وَمَا يَذۡكُرُونَ الغَيْبُ خَصَّ وَخَلَّلَا"],["وَرَا بَرِقَ افْتَحْ آمِناً، يَذَرُونَ مَعْ","يُحِبُّونَ حَقٌّ كَفَّ، يُمۡنَيٰ عُلىً عَلَا."],["سَلَٰسِلَاْ نَوِّنْ إِذْ رَوَوْا صَرْفَهُ لَنَا","وَبِالقَصْرِ قِفْ مِنْ عَنْ هُدَى خُلْفِهِمْ فَلَا"],["زَكَا، وَقَوَارِيرࣰا فَنَوِّنْهُ إِذْ دَنَا","رِضَا صَرْفِهِ وَاقْصُرْهُ فِي الوَقْفِ فَيْصَلَا"],["وَفِي الثَّانِ نَوِّنْ إِذْ رَوَوْا صَرْفَهُ وَقُلْ","يَمُدُّ هِشَامٌ وَاقِفاً مَعْهُمُۥ وِلَا"],["وَعَٰلِيهِمَ اسْكِنْ وَاكْسِرِ الضَّمَّ إِذْ فَشَا","وَخُضۡرࣱ بِرَفْعِ الخَفْضِ عَمَّ حُلىً عُلَى"],["وَإِسۡتَبۡرَقࣱ حِرْمِيُّ نَصْرٍ، وَخَاطَبُوا","تَشَآءُونَ حِصْناً. أُقِّتَتۡ وَاوُهُ حَلاَ"],["وَبِالهَمْزِ بَاقِيهِمْ، قَدَرۡنَا ثَقِيلٌ اِذْ","رَسَا، وَجِمَٰلَٰتࣱ فَوَحِّدْ شَذاً عَلاَ"],["وَقُلْ لَٰبِثِينَ القَصْرُ فَاشٍ، وَقُلْ وَلَا","كِذَٰبࣰا بِتَخْفِيفِ الكِسَائِيِّ أَقْبَلَا"],["وَفِي رَفْعِ بَا رَبِّ ٱلسَّمَٰوَٰتِ خَفْضُهُ","ذَلُولٌ، وَفِي ٱلرَّحۡمَٰنِ نَامِيهِ كَمَّلَا."],["وَنَٰخِرَةࣰ بِالمَدِّ صُحْبَتُهُمْ، وَفِي","تَزَكَّىٰ. تَصَدَّىٰ الثَّانِ حِرْمِيٌّ اَثْقَلَا"],["فَتَنفَعُهُ فِي رَفْعِهِ نَصْبُ عَاصِمٍ","وَإِنَّا صَبَبۡنَا فَتْحُهُ ثَبْتُهُ تَلاَ."],["وَخَفَّفَ حَقٌّ سُجِّرَتۡ، ثِقْلُ نُشِّرَتۡ","شَرِيعَةُ حَقٍّ، سُعِّرَتۡ عَنْ أُولِي مَلَا"],["وَظَا بِضَنِينࣲ حَقُّ رَاوٍ. وَخَفَّ فِي","فَعَدَّلَكَ الكُوفِي، وَحَقُّكَ يَوۡمُ لَا."],["وَفِي فَـٰكِهِينَ اقْصُرْ عَلَا، وَخِتَٰمُهُ","بِفَتْحٍ وَقَدِّمْ مَدَّهُ رَاشِداً وَلَا."],["يُصَلَّىٰ ثَقِيلاً ضُمَّ عَمَّ رِضاً دَنَا","وَبَا تَرۡكَبُنَّ اضْمُمْ حَياً عَمَّ نُهَّلَا."],["وَمَحۡفُوظࣱ اخْفِضْ رَفْعَهُ خُصَّ، وَهْوَ فِي ٱلۡـ","ـمَجِيدِ شَفَا. وَالخِفُّ قَدَّرَ رُتِّلاَ"],["وَبَلۡ يُؤۡثِرُونَ حُزْ. وَتُصۡلَىٰ يُضَمُّ حُزْ","صَفَا، يُسۡمَعُ التَّذْكِيرُ حَقٌّ وَذُو جَلَا"],["وَضَمَّ أُولُو حَقٍّ، وَلَٰغِيَةࣱ لَهُمْ","مُصَيۡطِرٍ اَشْمِمْ ضَاعَ وَالخُلْفُ قُلِّلَا"],["وَبِالسِّينِ لُذْ. وَٱلۡوَتۡرِ بِالكَسْرِ شَائِعٌ","فَقَدَّرَ يَرْوِي اليَحْصَبِيُّ مُثَقَّلَا"],["وَأَرْبَعُ غَيْبٍ بَعْدَ بَل لَّا حُصُولُهَا","تَحُضُّونَ فَتْحُ الضَّمِّ بِالمَدِّ ثُمِّلَا"],["يُعَذِّبُ فَافْتَحْهُۥ وَيُوثِقُ رَاوِياً","وَيَاءَانِ فِي رَبِّي. وَفَكُّ ارْفَعَنْ وِلَا"],["وَبَعْدُ اخْفِضَنْ، وَاكْسِرْ وَمُدَّ مُنَوِّناً","مَعَ الرَّفْعِ إِطۡعَٰمࣱ نَدىً عَمَّ فَانْهَلَا"],["وَمُؤۡصَدَةࣱ فَاهْمِزْ مَعاً عَنْ فَتىً حَمَى.","وَلَا عَمَّ فِي «وَالشَّمْسِ» بِالفَا وَأَبْجَلَا"],["وَعَنْ قُنْبُلٍ قَصْراً رَوَى ابْنُ مُجَاهِدٍ","رَءَاهُ وَلَمْ يَأْخُذْ بِهِ مُتَعَمِّلاَ."],["وَمَطۡلِعِ كَسْرُ اللَّامِ رَحْبٌ. وَحَرْفَيِ ٱلۡـ","ـبَرِيَّةِ فَاهْمِزْ آهِلًا مُتَأَهِّلَا."],["وَتَا تَرَوُنَّ اضْمُمْ فِي الُاولَى كَمَا رَسَا.","وَجَمَّعَ بِالتَّشْدِيدِ شَافِيهِ كَمَّلَا"],["وَصُحْبَةٌ الضَّمَّيْنِ فِي عُمُدࣲ وَعَوْا.","لِإِيلَٰفِ بِاليَا غَيْرُ شَامِيِّهِمْ تَلاَ"],["وَإِۦلَٰفِ كُلٌّ، وَهْوَ فِي الخَطِّ سَاقِطٌ.","وَلِي دِينِ قُلْ فِي الكَافِرِينَ تَحَصَّلَا."],["وَهَاءَ أَبِى لَهۡبࣲ بِالِاسْكَانِ دَوَّنُوا","وَحَمَّالَةُ المَرْفُوعُ بِالنَّصْبِ نُزِّلَا"],["رِوَى القَلْبِ ذِكْرُ اللَّهِ فَاسْتَسْقِ مُقْبِلَا","وَلَا تَعْدُ رَوْضَ الذَّاكِرِينَ فَتُمْحِلَا"],["وَآثِرْ عَنِ الآثَارِ مَثْرَاةَ عَذْبِهِ","وَمَا مِثْلُهُ لِلْعَبْدِ حِصْناً وَمَوْئِلاَ"],["وَلَا عَمَلٌ أَنْجَى لَهُ مِنْ عَذَابِهِ","غَدَاةَ الجَزَا مِنْ ذِكْرِهِ مُتَقَبَّلاَ"],["وَمَنْ شَغَلَ القُرْآنُ عَنْهُ لِسَانَهُ","يَنَلْ خَيْرَ أَجْرِ الذَّاكِرِينَ مُكَمَّلاَ"],["وَمَا أَفْضَلُ الأَعْمَالِ إِلَّا فْتِتَاحُهُ","مَعَ الخَتْمِ حَلاًّ وَارْتِحَالاً مُوَصَّلاَ"],["وَفِيهِ عَنِ المَكِّينَ تَكْبِيرُهُمْ مَعَ الـ","ـخَوَاتِمِ قُرْبَ الخَتْمِ يُرْوَى مُسَلْسَلَا"],["إِذَا كَبَّرُوا فِي آخِرِ النَّاسِ أَرْدَفُوا","مَعَ الحَمْدِ حَتَّى ٱلۡمُفۡلِحُونَ تَوَسُّلاَ"],["وَقَالَ بِهِ البَزِّيُّ مِنْ آخِرِ الضُّحَى","وَبَعْضٌ لَهُ مِنْ آخِرِ اللَّيْلِ وَصَّلاَ"],["فَإِنْ شِئْتَ فَاقْطَعْ دُونَهُ أَوْ عَلَيْهِ أَوْ","صِلِ الكُلَّ دُونَ القَطْعِ مَعْهُ مُبَسْمِلَا"],["وَمَا قَبْلَهُ مِنْ سَاكِنٍ أَوْ مُنَوَّنٍ","فَلِلسَّاكِنَيْنِ اكْسِرْهُ فِي الوَصْلِ مُرْسَلَا"],["وَأَدْرِجْ عَلَى إِعْرَابِهِ مَا سِوَاهُمَا","وَلَا تَصِلَنْ هَاءَ الضَّمِيرِ لِتُوصَلاَ"],["وَقُلْ لَفْظُهُ: «أَللَّهُ أَكْبَرْ»، وَقَبْلَهُ","لِأَحْمَدَ زَادَ ابْنُ الحُبَابِ فَهَيْلَلَا"],["وَقِيلَ بِهَذَا عَنْ أَبِي الفَتْحِ فَارِسٍ","وَعَنْ قُنْبُلٍ بَعْضٌ بِتَكْبِيرِهِ تَلاَ"],["وَهَاكَ مَوَازِينَ الحُرُوفِ وَمَا حَكَى","جَهَابِذَةُ النُّقَّادِ فِيهَا مُحَصَّلاَ"],["وَلَا رِيبَةٌ فِي عَيْنِهِنَّ وَلَا رِبا","وَعِنْدَ صَلِيلِ الزَّيْفِ يَصْدُقُ الِابْتِلاَ"],["وَلَا بُدَّ فِي تَعْيِينِهِنَّ مِنَ الأُلَى","عُنُوا بِالمَعَانِي عَامِلِينَ وَقُوَّلَا"],["فَأَبْدَأُ مِنْهَا بِالمَخَارِجِ مُرْدِفاً","لَهُنَّ بِمَشْهُورِ الصِّفَاتِ مُفَصِّلاَ"],["ثَلاَثٌ بِأَقْصَى الحَلْقِ وَاثْنَانِ وَسْطَهُ","وَحَرْفَانِ مِنْهَا أَوَّلَ الحَلْقِ جَمَّلاَ"],["وَحَرْفٌ لَهُ أَقْصَى اللِّسَانِ وَفَوْقَهُ","مِنَ الحَنَكِ احْفَظْهُۥ وَحَرْفٌ بِأَسْفَلَا"],["وَوَسْطُهُمَا مِنْهُۥ ثَلاَثٌ وَحَافَةُ الـ","ـلِسَانِ فَأَقْصَاهَا لِحَرْفٍ تَطَوَّلَا"],["إِلَى مَا يَلِي الأَضْرَاسَ وَهْوَ لَدَيْهِمَا","يَعِزُّ وَبِاليُمْنَى يَكُونُ مُقَلَّلاَ"],["وَحَرْفٌ بِأَدْنَاهَا إِلَى مُنْتَهَاهُ قَدْ","يَلِي الحَنَكَ الأَعْلَى وَدُونَهُ ذُو وِلَا"],["وَحَرْفٌ يُدَانِيهِۦ إِلَى الظَّهْرِ مُدْخَلٌ","وَكَمْ حَاذِقٍ مَعْ سِيبَوَيْهِ بِهِ اجْتَلَى"],["وَمِنْ طَرَفٍ هُنَّ الثَّلاَثُ لِقُطْرُبٍ","وَيَحْيَى مَعَ الجَرْمِيِّ مَعْنَاهُ قُوِّلَا"],["وَمِنْهُ وَمِنْ عُلْيَا الثَّنَايَا ثَلاَثَةٌ","وَمِنْهُ وَمِنْ أَطْرَافِهَا مِثْلُهَا انْجَلَى"],["وَمِنْهُ وَمِنْ بَيْنِ الثَّنَايَا ثَلاَثَةٌ","وَحَرْفٌ مِنَ اطْرَافِ الثَّنَايَا هِيَ العُلَى"],["وَمِنْ بَاطِنِ السُّفْلَى مِنَ الشَّفَتَيْنِ قُلْ","وَلِلشَّفَتَيْنِ اجْعَلْ ثَلاَثاً لِتَعْدِلَا"],["وَفِي أُوَلٍ مِنْ كِلْمِ بَيْتَيْنِ جَمْعُهَا","سِوَى أَرْبَعٍ فِيهِنَّ كِلْمَةُ أَوَّلَا"],["أَهَاعَ حَشَا غَاوٍ خَلَا قَارِئٍ كَمَا","جَرَى شَرْطُ يُسْرَى ضَارِعٍ لَاحَ نَوْفَلَا"],["رَعَى طُهْرَ دِينٍ تَمَّهُ ظِلُّ ذِي ثَناً","صَفَا سَجْلَ زُهْدٍ فِي وُجُوهٍ بَنِي مَلَا"],["وَغُنَّةُ تَنْوِينٍ وَنُونٍ وَمِيمٍ اِنْ","سَكَنَّ وَلَا إِظْهَارَ فِي الأَنْفِ تُجْتَلَى"],["وَجَهْرٌ وَرِخْوٌ وَانْفِتَاحٌ صِفَاتُهَا","وَمُسْتَفِلٌ فَاجْمَعْ بِالَاضْدَادِ أَشْمُلاَ"],["فَمَهْمُوسُهَا عَشْرٌ حَثَتْ كِسْفَ شَخْصِهِ","أَجَدَّتْ كَقُطْبٍ لِلشَّدِيدَةِ مُثِّلاَ"],["وَمَا بَيْنَ رِخْوٍ وَالشَّدِيدَةِ عَمْرُنَلْ","وَوَايٌ حُرُوفُ المَدِّ، وَالرِّخْوَ كَمَّلَا"],["وَقِظْ خُصَّ ضَغْطٍ سَبْعُ عُلْوٍ، وَمُطْبَقٌ","هُوَ الضَّادُ وَالظَّا أُعْجِمَا وَإِنُ اهْمِلَا"],["وَصَادٌ وَسِينٌ مُهْمَلاَنِ وَزَايُهَا","صَفِيرٌ، وَشِينٌ بِالتَّفَشِّي تَعَمَّلاَ"],["وَمُنْحَرِفٌ لَامٌ وَرَاءٌ، وَكُرِّرَتْ","كَمَا المُسْتَطِيلُ الضَّادُ لَيْسَ بِأَغْفَلَا"],["كَمَا الأَلِفُ الهَاوِي، وَآوِي لِعِلَّةٍ","وَفِي قُطْبِ جِدٍّ خَمْسُ قَلْقَلَةٍ عُلَى"],["وَأَعْرَفُهُنَّ القَافُ كُلٌّ يَعُدُّهَا","فَهَذَا مَعَ التَّوْفِيقِ كَافٍ مُحَصِّلاَ"],["وَقَدْ وَفَّقَ اللَّهُ الكَرِيمُ بِمَنِّهِ","لِإِكْمَالِهَا حَسْنَاءَ مَيْمُونَةَ الجِلاَ"],["وَأَبْيَاتُهَا: أَلْفٌ تَزِيدُ ثَلاَثَةً","وَمَعْ مِئَةٍ سَبْعِينَ زُهْراً وَكُمَّلاَ"],["وَقَدْ كُسِيَتْ مِنْهَا المَعَانِي عِنَايَةً","كَمَا عَرِيَتْ عَنْ كُلِّ عَوْرَاءَ مِفْصَلَا"],["وَتَمَّتْ بِحَمْدِ اللَّهِ فِي الخُلْقِ سَهْلَةً","مُنَزَّهَةً عَنْ مَنْطِقِ الهُجْرِ مِقْوَلَا"],["وَلَكِنَّهَا تَبْغِي مِنَ النَّاسِ كُفْئَهَا","أَخَا ثِقَةٍ يَعْفُو وَيُغْضِي تَجَمُّلاَ"],["وَلَيْسَ لَهَا إِلَّا ذُنُوبُ وَلِيِّهَا","فَيَا طَيِّبَ الأَنْفَاسِ أَحْسِنْ تَأَوُّلَا"],["وَقُلْ: رَحِمَ الرَّحْمَـٰنُ حَيّاً وَمَيِّتاً","فَتىً كَانَ لِلْإِنْصَافِ وَالحِلْمِ مَعْقِلَا"],["عَسَى اللَّهُ يُدْنِي سَعْيَهُ بِجَوَازِهِ","وَإِنْ كَانَ زَيْفاً غَيْرَ خَافٍ مُزَلَّلاَ"],["فَيَا خَيْرَ غَفَّارٍ وَيَا خَيْرَ رَاحِمٍ","وَيَا خَيْرَ مَأْمُولٍ جَداً وَتَفَضُّلاَ"],["أَقِلْ عَثْرَتِي وَانْفَعْ بِهَا وَبِقَصْدِهَا","حَنَانَيْكَ يَا أَللَّهُ يَا رَافِعَ العُلَى"],["وَآخِرُ دَعْوَانَا بِتَوْفِيقِ رَبِّنَا","أَنِ الحَمْدُ لِلَّهِ الَّذِي وَحْدَهُ عَلاَ"],["وَبَعْدُ: صَلاَةُ اللَّهِ ثُمَّ سَلاَمُهُ","عَلَى سَيِّدِ الخَلْقِ الرِّضَا مُتَنَخَّلاَ"],["مُحَمَّدٍ المُخْتَارِ لِلْمَجْدِ كَعْبَةً","صَلاَةً تُبَارِي الرِّيحَ مِسْكاً وَمَنْدَلَا"],["وَتُبْدِي عَلَى أَصْحَابِهِ نَفَحَاتِهَا","بِغَيْرِ تَنَاهٍ زَرْنَباً وَقَرَنْفُلاَ"]],"sections":[{"t":"مُقَدِّمَةُ النَّاظِمِ","f":1},{"t":"بَابُ الِاسْتِعَاذَةِ","f":95},{"t":"بَابُ البَسْمَلَةِ","f":100},{"t":"سُورَةُ أُمِّ القُرْآنِ","f":108},{"t":"بَابُ الإِدْغَامِ الكَبِيرِ","f":116},{"t":"بَابُ إِدْغَ const V = DATA.verses, N = V.length;

/* ---------- sections ---------- */
// mark parents: a header whose start equals the next header's start
const SECS = [];
(function(){
  const raw = DATA.sections;
  let parent = '';
  let group = 'أصول';
  for (let i=0;i<raw.length;i++){
    const s = raw[i], nx = raw[i+1];
    const clean = s.t.replace(/[\s:]+$/,'');
    if (nx && nx.f === s.f){ // container header
      parent = clean.replace(/^بابُ\s*/,'').replace(/^بَابُ\s*/,'');
      if (/فَرْشِ/.test(clean)) { group='فرش'; parent=''; }
      continue;
    }
    const to = nx ? nx.f-1 : N;
    const isFasl = /^ف[َُ]?ص/.test(clean);
    const label = (isFasl && parent ? parent+' — ' : '') + clean;
    if (!isFasl) parent = '';
    SECS.push({t:label, f:s.f, to, g:group});
  }
})();
function secOf(n){ let r=SECS[0]; for(const s of SECS){ if(s.f<=n) r=s; } return r; }

/* ---------- Arabic normalisation & matching ---------- */
const DIAC = /[ؐ-ًؚ-ٰٟۖ-ۭـ‌‍‎‏]/g;
function norm(w){
  return (w||'').replace(DIAC,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[^ء-ي]/g,'');
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
function joinSame(a,b,t){ if(Math.abs(a.length+b.length-t.length)>3) return false; return same(a+b,t) || same(a+b.replace(/^ا/,''),t) || same(a+b.replace(/^ال/,'ل'),t); }
function same(e,t){
  if(e===t) return true;
  const L=Math.max(e.length,t.length);
  if(e.length<=2) return false;
  // tolerate a dropped/added conjunction (و ف) or article
  const strip=x=>x.replace(/^(و|ف)/,'');
  if(strip(e)===strip(t)) return true;
  const sim=1-lev(e,t)/L;
  return sim >= (e.length<=4 ? 0.74 : 0.67);
}

const store = {

/*
 session = {
   list:[verse numbers shown], W:[{n,h,disp,key}],
   toks:[{k,r}] settled words heard, partial:'' live guess,
   fE,fT: frozen prefix (words / tokens) so long recitations stay fast,
   status:[], heard:[], hints:Set, ok:Set, end, recorded:Set, retry:bool
 }
*/
let session = null;

function wordsOf(list){
  const W=[];
  list.forEach(n=>{
    V[n-1].forEach((hem,h)=>{
      hem.split(/\s+/).filter(Boolean).forEach(disp=>{
        const key=norm(disp);
        if(key) W.push({n,h,disp,key}); else if(W.length) W[W.length-1].disp+=' '+disp;
      });
    });
  });
  return W;
}
function buildSession(list, retry){
  const W=wordsOf(list);
  session={list:list.slice(),W,toks:[],partial:'',fE:0,fT:0,
    status:new Array(W.length).fill('pending'),heard:new Array(W.length).fill(''),
    hints:new Set(),ok:new Set(),end:0,recorded:new Set(),retry:!!retry,done:false};
  typedEl.value='';
  renderVerses(); align();
}
function extendSession(list){
  const s=session, startIdx=s.W.length;
  const W=wordsOf(list);
  s.list.push(...list); s.W.push(...W);
  s.status.push(...new Array(W.length).fill('pending')); s.heard.push(...new Array(W.length).fill(''));
  renderVerses(startIdx);
  toIn.value=s.list[s.list.length-1]; updateRangeInfo();
}

/* ---------- words heard ---------- */
function tokensOf(str){ return (str||'').split(/\s+/).filter(w=>norm(w)).map(w=>({k:norm(w),r:w})); }
function addFinal(t){ if(!session||!t||!t.trim()) return; heardAt=Date.now(); session.toks.push(...tokensOf(t)); session.partial=''; align(); }
function setPartial(t){ if(!session) return; if(t) heardAt=Date.now(); session.partial=t||''; align(); }

/* ---------- alignment (DP with free tail + frozen prefix) ---------- */
const INS=0.7, DEL=1, SUB=1;
function align(){
  const s=session; if(!s) return;
  const E=s.W, base=s.fE;
  const T=s.toks.slice(s.fT).concat(tokensOf(s.partial));
  const settled=s.toks.length-s.fT;
  const n=T.length, rem=E.length-base, m=Math.min(rem, n*2+12);
  for(let k=base;k<E.length;k++){ s.status[k]='pending'; s.heard[k]=''; }
  let end=base;
  if(n && m>0){
    const W1=m+1;
    const D=new Float32Array((n+1)*W1), B=new Uint8Array((n+1)*W1);
    const free=(base===0 && s.given)?s.given:0;
    for(let j=1;j<=m;j++){ D[j]= j<=free ? 0 : (j-free)*DEL; B[j]= j<=free ? 4 : 2; }
    for(let i=1;i<=n;i++){
      D[i*W1]=i*INS; B[i*W1]=1;
      const tk=T[i-1].k;
      for(let j=1;j<=m;j++){
        const match=same(E[base+j-1].key,tk);
        let best=D[(i-1)*W1+j-1]+(match?0:SUB), b=match?0:3;
        const ins=D[(i-1)*W1+j]+INS; if(ins<best){best=ins;b=1;}
        const del=D[i*W1+j-1]+DEL; if(del<best){best=del;b=2;}
        // one heard word = two written words, or two heard words = one written word («يا ذا» / «ياذا»)
        if(j>=2 && D[(i-1)*W1+j-2]<best && joinSame(E[base+j-2].key,E[base+j-1].key,tk)){ best=D[(i-1)*W1+j-2]; b=5; }
        if(i>=2 && D[(i-2)*W1+j-1]<best && Math.abs(E[base+j-1].key.length-T[i-2].k.length-tk.length)<=2 && same(E[base+j-1].key,T[i-2].k+tk)){ best=D[(i-2)*W1+j-1]; b=6; }
        D[i*W1+j]=best; B[i*W1+j]=b;
      }
    }
    let bj=0, bv=Infinity;
    for(let j=0;j<=m;j++){ const v=D[n*W1+j]; if(v<bv-1e-6 || (Math.abs(v-bv)<1e-6 && j>bj)){bv=v;bj=j;} }
    end=base+bj;
    const pairI=new Int32Array(bj+1);
    let i=n,j=bj;
    while(i>0||j>0){
      const b=B[i*W1+j];
      if(i>0&&j>0&&(b===0||b===3)){ s.status[base+j-1]=b===0?'ok':'bad'; if(b===3) s.heard[base+j-1]=T[i-1].r; pairI[j]=i; i--; j--; }
      else if(b===5&&i>0&&j>=2){ s.status[base+j-1]=s.status[base+j-2]='ok'; pairI[j]=pairI[j-1]=i; i--; j-=2; }
      else if(b===6&&i>=2&&j>0){ s.status[base+j-1]='ok'; pairI[j]=i; i-=2; j--; }
      else if(i===0&&b===4){ break; }                       // started after the words shown as the prompt
      else if(j>0&&(b===2||i===0)){ s.status[base+j-1]='miss'; j--; }
      else { i--; }
    }
    // freeze everything well behind the reciter, so the work per update stays small
    if(bj>40){
      for(let jj=bj-20;jj>0;jj--){ if(pairI[jj]>0 && pairI[jj]<=settled){ s.fE=base+jj; s.fT+=pairI[jj]; break; } }
    }
  }
  s.end=end;
  paint();
  if(E.length && end>=E.length && !s.done) rangeDone();
}

  const startList = s.list.indexOf(s.W[fromIdx] ? s.W[fromIdx].n : -1);
  if(TEST && !fromIdx) versesEl.appendChild(cardHead());
  if(s.retry && !fromIdx){ const t=document.createElement('div'); t.className='sec-title'; t.textContent='مراجعة الأبيات التي فيها أخطاء'; versesEl.appendChild(t); }
  let k=0;
  s.list.slice(startList<0?s.list.length:startList).forEach(n=>{
    const sec=secOf(n);
    if(!s.retry && !TEST && (prevN===null || secOf(prevN)!==sec)){
      const t=document.createElement('div'); t.className='sec-title'; t.textContent=sec.t; versesEl.appendChild(t);
    }
    prevN=n;
    const v=document.createElement('div'); v.className='verse'; v.dataset.n=n; v.style.setProperty('--k', Math.min(k++,12));
    const st=stats[n]; const cls= st ? (st.e===0?' done':' weak') : '';
    v.innerHTML=`<div class="num${cls}">${n}</div><div class="hem-wrap"><div class="hem a"></div><div class="hem b"></div></div><span class="play-tag">ابدأ من هنا</span>`;
    const hems=v.querySelectorAll('.hem');
    while(idx<s.W.length && s.W[idx].n===n){
      const w=s.W[idx]; const sp=document.createElement('span');
      sp.className='w'; sp.textContent=w.disp; sp.dataset.i=idx;
      hems[w.h].appendChild(sp); hems[w.h].appendChild(document.createTextNode(' '));
      wordEls.push(sp); idx++;
    }
    versesEl.appendChild(v);
  });
}
function firstOfHem(i){ const W=session.W; return i===0 || W[i-1].n!==W[i].n || W[i-1].h!==W[i].h; }
let lastCurVerse=null;
function paint(){
  const s=session; if(!s) return;
  wordEls.forEach((el,i)=>{
    const st=s.status[i];
    const hinted=s.hints.has(i), accepted=s.ok.has(i);
    let c='w';
    if(accepted && st!=='pending') c+=' ok';
    else if(hinted) c+=' hint';
    else if(st==='pending' && s.given && i<s.given) c+=' given';
    else if(st==='pending'){
      const vm = TEST ? (TEST.reveal ? 'show' : 'hide') : mode;
      if(vm==='show') c+=' show';
      else if(vm==='hint' && firstOfHem(i)) c+=' pending peek';
      else c+=' pending';
    }
    else c+=' '+st;
    if(i===s.end) c+=' next';
    if(el.className!==c) el.className=c;
    el.title = (st==='bad' && s.heard[i]) ? 'سُمِع: '+s.heard[i] : '';
  });
  const curVerse = s.W.length ? s.W[Math.min(s.end,s.W.length-1)].n : null;
  if(curVerse!==lastCurVerse){
    versesEl.querySelectorAll('.verse.current').forEach(v=>v.classList.remove('current'));
    const cv=versesEl.querySelector(`.verse[data-n="${curVerse}"]`);
    if(!TEST) document.getElementById('barTitle').textContent=secOf(curVerse).t;
    if(cv){ cv.classList.add('current'); if(isListening()) cv.scrollIntoView({block:'center',behavior:'smooth'}); }
    lastCurVerse=curVerse;
  }
  document.getElementById('prog').style.width = (s.W.length ? 100*s.end/s.W.length : 0)+'%';
  renderLive();
}

function renderLive(){
  const s=session;
  const recent = s && isListening() && (s.partial || Date.now()-heardAt<5000) && typedEl.classList.contains('hidden');
  if(recent){
    const all=s.toks.slice(-12).map(t=>t.r).join(' ');
    const last=(all+' '+s.partial).trim().split(/\s+/).slice(-8).join(' ');
    liveEl.classList.remove('status'); liveEl.textContent=last;
  } else { liveEl.classList.add('status'); liveEl.textContent=statusText; }
}
setInterval(()=>{ if(isListening()) renderLive(); }, 1500);

/* tapping a red/orange word: show what was heard; second tap accepts it as correct */
versesEl.addEventListener('click',e=>{
  if(!session) return;
  const act=e.target.closest('[data-act]');
  if(act){ testAction(act.dataset.act); return; }
  const el=e.target.closest('.w');
  const st0 = el ? session.status[+el.dataset.i] : null;
  if(!el || !(st0==='bad'||st0==='miss'||session.ok.has(+el.dataset.i))){
    const v=e.target.closest('.verse'); if(!v || TEST) return;
    startFrom(+v.dataset.n); return;
  }
  const i=+el.dataset.i, st=session.status[i];
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  if(st==='bad'||st==='miss'){
    if(el.dataset.armed){ session.ok.add(i); delete el.dataset.armed; paint(); return; }
    el.dataset.armed='1';
    const pop=document.createElement('span'); pop.className='pop';
    pop.textContent=(st==='bad'&&session.heard[i]?'سُمِع: «'+session.heard[i]+'» · ':'')+'اضغط مرة ثانية لاعتبارها صحيحة';
    el.appendChild(pop); setTimeout(()=>{pop.remove(); delete el.dataset.armed;},3000);
  } else if(session.ok.has(i)){ session.ok.delete(i); paint(); }
});

/* ---------- results per verse ---------- */
function verseResult(n){
  const s=session; let e=0, words=[], reached=false, lastIdx=-1;
  s.W.forEach((w,i)=>{ if(w.n!==n) return; lastIdx=i;
    const st=s.status[i]; if(st==='pending') return; reached=true;
    if(s.ok.has(i)) return;
    if(s.hints.has(i)){ e++; words.push({w:w.disp,t:'hint'}); return; }
    if(st==='bad'){ e++; words.push({w:w.disp,t:'bad',h:s.heard[i]}); }
    else if(st==='miss'){ e++; words.push({w:w.disp,t:'miss'}); }
  });
  const complete = lastIdx>=0 && s.status[lastIdx]!=='pending';
  return {e,words,reached,complete};
}
function recordVerses(list){
  list.forEach(n=>{
    if(session.recorded.has(n)) return;
    const r=verseResult(n); if(!r.complete) return;
    const st=stats[n]||{a:0,p:0}; st.a++; st.e=r.e; if(!r.e) st.p++; st.t=Date.now(); stats[n]=st;
    session.recorded.add(n);
    const num=versesEl.querySelector(`.verse[data-n="${n}"] .num`); if(num){ num.classList.toggle('done',!r.e); num.classList.toggle('weak',!!r.e); }
  });
  store.set('stats',stats);
}

/* finished every word on screen: keep the mic on and bring in the next verses */
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2600); }
function rangeDone(){
  const s=session;
  if(TEST){ s.done=true; cardDone(true); return; }
  const chunk=s.list.slice(s.chunkStart||0);
  recordVerses(chunk);
  let okW=0,totW=0; chunk.forEach(n=>{ const r=verseResult(n); s.W.forEach((w,i)=>{ if(w.n===n){ totW++; if(s.status[i]==='ok'&&!s.hints.has(i)||s.ok.has(i)) okW++; } }); });
  const pct=totW?Math.round(100*okW/totW):0;
  const lastN=s.list[s.list.length-1];
  if(s.retry || lastN>=N){ s.done=true; setTimeout(()=>finish(true),600); return; }
  // next chunk
  const c=chunkSize(); const sec=secOf(lastN+1);
  const to = c ? Math.min(N, sec.to, lastN+c) : sec.to;
  const next=[]; for(let n=lastN+1;n<=to;n++) next.push(n);
  s.chunkStart=s.list.length;
  extendSession(next);
  toast(`${pct>=95?'ما شاء الله':'أحسنت'} — ${pct}% · نكمل من البيت ${lastN+1}`);
  paint();
}

  secSel.append(groups['أصول'],groups['فرش']);

function secIndexOf(n){ let k=0; SECS.forEach((s,i)=>{ if(s.f<=n) k=i; }); return k; }
function updateRangeInfo(){
  const f=+fromIn.value, t=+toIn.value;
  const sec=SECS[secIndexOf(f)];
  document.getElementById('barTitle').textContent=sec.t;
  document.getElementById('barSub').textContent=`الأبيات ${f}–${t}`;
  let done=0; for(let n=sec.f;n<=sec.to;n++) if(stats[n]&&stats[n].e===0) done++;
  const pc=Math.round(100*done/(sec.to-sec.f+1));

function setRange(f,t,save=true){

}
function chunkSize(){ return +(settings.chunk ?? 5); }
function rangeFor(f){ const c=chunkSize(); const s=SECS[secIndexOf(f)]; return c?Math.min(s.to,f+c-1):s.to; }

/* ---------- device / browser checks ---------- */
const UA=navigator.userAgent||'';
const IS_IOS=/iPhone|iPad|iPod/i.test(UA) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(UA);
const IN_APP=/FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|TikTok|musical_ly|MicroMessenger|WhatsApp|Twitter|; wv\)/i.test(UA);
const IS_SAMSUNG=/SamsungBrowser/i.test(UA);
const IS_IOS_NONSAFARI=IS_IOS && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA);
const IN_CLAUDE_FRAME = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;

function showBanner(html){ const b=document.getElementById('banner'); b.innerHTML=html; b.classList.remove('hidden'); }
function openInChromeLink(){
  const u=location.href.replace(/^https?:\/\//,'');
  return `intent://${u}#Intent;scheme=https;package=com.android.chrome;end`;
}
function copyLinkBtn(){ return `<button class="btn small" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>toast('تم نسخ الرابط'),()=>{})">نسخ الرابط</button>`; }
function browserAdvice(){
  if(IN_CLAUDE_FRAME) return; // Claude's own dictation handles this view
  if(IN_APP || !WebSR || IS_SAMSUNG || IS_IOS_NONSAFARI){
    if(IS_ANDROID) showBanner(`المايك لا يعمل في هذا المتصفح. افتح التطبيق في <b>Chrome</b>: <a class="btn small primary" href="${openInChromeLink()}">فتح في Chrome</a> ${copyLinkBtn()}`);
    else if(IS_IOS) showBanner(`المايك يعمل في <b>Safari</b> فقط على الآيفون. انسخ الرابط والصقه في Safari. ${copyLinkBtn()}`);
    else showBanner(`المايك يحتاج متصفح <b>Chrome</b> أو <b>Edge</b> أو <b>Safari</b>. ${copyLinkBtn()}`);
  }
}

/* ---------- speech engines ---------- */
const micBtn=document.getElementById('micBtn');
let engine=null; // 'claude' | 'web' | null
let dict=null, rec=null, recActive=false, wantListen=false, everStarted=false, restarting=false;
let runFinalIdx=0, runLastFinal=[], runPartial='';
function setStatus(t){ statusText=t; renderLive(); }
function setMic(state){ micBtn.classList.toggle('on',state==='on'); micBtn.classList.toggle('busy',state==='busy'); micBtn.setAttribute('aria-label',state==='on'?'إيقاف':'بدء التسميع'); }
function isListening(){ return wantListen || recActive || (engine==='claude'&&dict&&dict.active()); }

/* keep the screen awake while reciting */
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && wantListen) keepAwake(true); });

function nwords(t){ return (t||'').trim().split(/\s+/).filter(Boolean); }
function stripPrefix(words, prefix){
  // some Android builds repeat what was already settled at the start of each new result
  if(prefix.length && words.length>=prefix.length){
    let k=0; while(k<prefix.length && norm(words[k])===norm(prefix[k])) k++;
    if(k===prefix.length) return words.slice(k);
  }
  return words;
}
function initWeb(){
  if(!WebSR) return false;
  rec=new WebSR(); rec.lang='ar-SA'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart=()=>{ recActive=true; everStarted=true; restarting=false; runFinalIdx=0; runLastFinal=[]; runPartial='';
    setMic('on'); setStatus('أسمعك… سمّع وأنا أتابع معك'); };
  rec.onresult=e=>{
    let interim=[];
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i], words=nwords(r[0].transcript);
      if(r.isFinal){
        if(i<runFinalIdx) continue;
        runFinalIdx=i+1;
        const add = runLastFinal.length>=2 ? stripPrefix(words, runLastFinal) : words;
        runLastFinal = words.length>=runLastFinal.length ? words : runLastFinal.concat(add);
        if(add.length) addFinal(add.join(' '));
      } else interim=interim.concat(words);
    }
    if(runLastFinal.length>=2) interim=stripPrefix(interim, runLastFinal);
    runPartial=interim.join(' ');
    setPartial(runPartial);
  };
  rec.onerror=e=>{
    const er=e.error;
    if(er==='no-speech'||er==='aborted') return;
    if(er==='not-allowed' && everStarted && restarting){ wantListen=false; setStatus('توقّف المايك — اضغطه للمتابعة'); return; }
    wantListen=false;
    if(er==='not-allowed'){
      if(IS_IOS) showTyped('لم يُسمح بالمايك. من «الإعدادات ← Safari ← الميكروفون» اختر «سماح»، ثم أعد فتح الصفحة.');
      else showTyped('لم يُسمح بالمايك. اضغط على 🔒 بجانب الرابط ← الأذونات ← الميكروفون ← سماح، ثم أعد تحميل الصفحة.');
    }
    else if(er==='service-not-allowed'){
      if(IS_IOS) showTyped('على الآيفون لازم تفعيل «الإملاء»: الإعدادات ← عام ← لوحة المفاتيح ← تفعيل الإملاء، وتفعيل Siri. ثم أعد فتح الصفحة.');
      else showTyped('خدمة التعرّف على الصوت غير متوفرة على هذا الجهاز. ثبّت أو حدّث تطبيق «Google» ثم أعد المحاولة، أو سمّع بالكتابة.');
    }
    else if(er==='network') showTyped('التعرّف على الصوت يحتاج إنترنت، وعلى بعض الأجهزة (مثل هواوي بدون خدمات Google) لا يعمل. جرّب Chrome مع اتصال جيد، أو سمّع بالكتابة.');
    else if(er==='audio-capture') setStatus('الميكروفون مشغول أو غير موجود — أغلق التطبيقات الأخرى التي تستخدمه');
    else if(er==='language-not-supported') showTyped('هذا المتصفح لا يدعم العربية في التعرّف على الصوت — جرّب Chrome، أو سمّع بالكتابة.');
    else setStatus('خطأ في المايك ('+er+') — اضغط المايك مرة ثانية');
  };
  rec.onend=()=>{
    recActive=false;
    if(runPartial){ const p=runPartial; runPartial=''; addFinal(p); }
    if(wantListen){
      restarting=true;
      setTimeout(()=>{ if(!wantListen) return; try{ rec.start(); }catch(err){ wantListen=false; setMic('off'); setStatus('توقّف المايك — اضغطه للمتابعة'); keepAwake(false); } },80);
    } else { setMic('off'); keepAwake(false); }
  };
  return true;
}
function startListening(){
  if(engine==='claude'){
    setMic('busy');
    dict.start({language:'ar'}).catch(err=>{
      const c=err&&err.code;
      if(c==='not_granted') showTyped('لم يُسمح بالمايك — يمكنك التسميع بالكتابة');
      else if(c==='unavailable') showTyped('التعرّف على الصوت غير متاح هنا — افتح رابط الموقع في Chrome');
      else if(c==='dismissed'||c==='stopped') setStatus('اضغط المايك للبدء');
      else setStatus('تعذّر تشغيل المايك، حاول مرة ثانية');
      setMic('off');
    });
    keepAwake(true);
    return;
  }
  if(engine==='web'){
    wantListen=true; restarting=false; setMic('busy'); setStatus('جارٍ تشغيل المايك…'); keepAwake(true);
    try{ rec.start(); }
    catch(e){ try{ rec.abort(); }catch(_){} setTimeout(()=>{ try{ rec.start(); }catch(_){ wantListen=false; setMic('off'); setStatus('اضغط المايك مرة ثانية'); } },300); }
    return;
  }
  browserAdvice();
  showTyped('التسميع بالصوت غير متاح في هذا المتصفح — استخدم الكتابة أو مايك لوحة المفاتيح');
}
function softReset(){
  // drop what is being heard right now; the mic keeps running for the new verses
  runPartial='';
  if(engine==='web' && rec){ try{ rec.abort(); }catch(e){} }   // onend restarts it (wantListen stays true)
}
function stopListening(discard){
  wantListen=false;
  if(engine==='claude' && dict && dict.active()) dict.stop().catch(()=>{});
  if(engine==='web' && rec){
    if(discard){ runPartial=''; try{rec.abort();}catch(e){} }
    else { if(runPartial){ const p=runPartial; runPartial=''; addFinal(p); } try{rec.stop();}catch(e){} }
  }
  if(engine==='claude' && session && session.partial){ const p=session.partial; session.partial=''; addFinal(p); }
  setMic('off'); keepAwake(false);
}
micBtn.onclick=()=>{ if(isListening()){ stopListening(); setStatus('توقّف — اضغط المايك للمتابعة'); } else startListening(); };
