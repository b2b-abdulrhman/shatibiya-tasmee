(async function detect(){
  if(WebSR && !IN_CLAUDE_FRAME) { engine='web'; initWeb(); }
  browserAdvice();
  if(window.claude && typeof window.claude.use==='function'){
    try{
      const d=await window.claude.use('dictation');
      if(d){ dict=d; engine='claude';
        d.onPartial(({text})=>setPartial(text));
        d.onFinal(({text})=>addFinal(text));
        d.onState(({state,reason})=>{
          setMic(state==='listening'?'on':(state==='idle'?'off':'busy'));
          if(state==='listening') setStatus('أسمعك… سمّع وأنا أتابع معك');
          if(state==='idle'){
            if(session&&session.partial){ const p=session.partial; session.partial=''; addFinal(p); }
            keepAwake(false);
            if(reason==='not_granted') showTyped('لم يُسمح بالمايك — يمكنك التسميع بالكتابة');
            else if(reason==='unavailable') showTyped('التعرّف على الصوت غير متاح هنا — افتح رابط الموقع في Chrome');
            else if(reason==='hidden') setStatus('توقّف التسميع — اضغط المايك للمتابعة');
            else if(reason==='time_limit') setStatus('انتهت ساعة التسميع — اضغط المايك للمتابعة');
          }
        });
      }
    }catch(e){}
  }
  if(!engine){ typedEl.classList.remove('hidden'); setStatus('سمّع بالكتابة أو بزر المايك في لوحة مفاتيح الجوال'); }
})();

const GROUP_RANGE={}; SECS.forEach(s=>{ const g=GROUP_RANGE[s.g]||(GROUP_RANGE[s.g]=[N,1]); g[0]=Math.min(g[0],s.f); g[1]=Math.max(g[1],s.to); });
function fillScope(){
  const sel=$id('tScope'); sel.innerHTML='';
  const add=(v,t,parent)=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; (parent||sel).appendChild(o); };
  add('all',`كل المنظومة (1–${N})`);
  add('usul',`أبواب الأصول (${GROUP_RANGE['أصول'][0]}–${GROUP_RANGE['أصول'][1]})`);
  add('farsh',`فرش الحروف (${GROUP_RANGE['فرش'][0]}–${GROUP_RANGE['فرش'][1]})`);
  const g1=document.createElement('optgroup'); g1.label='باب معيّن'; sel.appendChild(g1);
  SECS.forEach((s,k)=>add('sec:'+k, `${plainT(s.t)} (${s.f}–${s.to})`, g1));
  add('custom','نطاق أحدده بنفسي…');

function scopeRange(){
  const v=tset.scope;
  if(v==='usul') return GROUP_RANGE['أصول'];
  if(v==='farsh') return GROUP_RANGE['فرش'];
  if(v.startsWith('sec:')){ const s=SECS[+v.slice(4)]; return [s.f,s.to]; }
  if(v==='custom'){ const a=Math.max(1,Math.min(N,tset.from|0)), b=Math.max(a,Math.min(N,tset.to|0)); return [a,b]; }
  return [1,N];
}
function pickPositions(lo,hi,P,K,weakFocus){
  K=Math.max(1,Math.min(K,hi-lo+1));
  const chosen=[];
  for(let p=0;p<P;p++){
    const cands=[], wts=[];
    for(let s=lo;s<=hi-K+1;s++){
      if(chosen.some(c=>s<=c+K-1 && s+K-1>=c)) continue;
      let w=1;
      if(secOf(s)!==secOf(s+K-1)) w*=.25;                       // prefer passages inside one chapter
      if(weakFocus){ let k=0; for(let n=s;n<s+K;n++) if(stats[n]&&stats[n].e>0) k++; w*=1+4*k; }
      cands.push(s); wts.push(w);
    }
    if(!cands.length) break;
    let r=Math.random()*wts.reduce((a,b)=>a+b,0), i=0;
    while(i<wts.length-1 && (r-=wts[i])>0) i++;
    chosen.push(cands[i]);
  }
  return chosen.map(s=>{ const list=[]; for(let n=s;n<s+K;n++) list.push(n); return {list}; });
}
function givenCount(n){
  const first=V[n-1][0].split(/\s+/).filter(w=>norm(w)).length;
  if(tset.prompt==='hem') return first;
  if(tset.prompt==='none') return 0;
  return Math.min(2, Math.max(1, first-1));
}
function startTest(cards){

}

$id('deck').addEventListener('click',e=>{ const b=e.target.closest('.mc'); if(!b||!TEST) return; const k=+b.dataset.k; if(k!==TEST.i) goCard(k); });
function cardResult(){
  const s=session; let ok=0,tot=0; const errs=[];
  s.W.forEach((w,i)=>{
    if(i<(s.given||0)) return;
    tot++; const st=s.status[i];
    if(s.ok.has(i) || (st==='ok' && !s.hints.has(i))) ok++;
    else if(s.hints.has(i)) errs.push({w:w.disp,t:'hint',n:w.n});
    else if(st==='bad') errs.push({w:w.disp,t:'bad',n:w.n,h:s.heard[i]});
    else if(st==='miss') errs.push({w:w.disp,t:'miss',n:w.n});
  });
  const said=s.status.some((st,i)=>i>=(s.given||0) && st!=='pending');
  return {pct: tot?Math.round(100*ok/tot):0, errs, list:s.list.slice(), complete:s.end>=s.W.length, revealed:TEST.reveal, said};
}
function cardDone(complete){
  if(!TEST) return;
  const r=cardResult(); TEST.results[TEST.i]=r;
  recordVerses(session.list); renderDeck();
  const last = TEST.results.filter(Boolean).length===TEST.cards.length;
  toast(complete ? `الموضع ${TEST.i+1}: ${r.pct}%${r.pct>=95?' — ما شاء الله':''}` : `تخطّيت الموضع ${TEST.i+1}`);
  if(last){ setTimeout(()=>testSummary(),800); return; }
  // next card that has no result yet
  let k=TEST.i+1; while(k<TEST.cards.length && TEST.results[k]) k++;
  if(k>=TEST.cards.length){ k=0; while(TEST.results[k]) k++; }
  setTimeout(()=>goCard(k), complete?900:250);
}

}

const TOUR=[
  {el:'#micBtn', t:'زر المايك', d:'اضغطه وابدأ التسميع. يظل يسمعك وأنت تنتقل من بيت لبيت، وتتلوّن الكلمات أولًا بأول. اضغطه مرة ثانية لتوقف.'},
  {el:'#verses .verse', round:18, t:'الأبيات', d:'اضغط على أي بيت ليبدأ التسميع منه مباشرة.<span class="legend"><span class="lg-ok">صحيح</span><span class="lg-bad">خطأ</span><span class="lg-miss">سقط منك</span><span class="lg-hint">بمساعدة التلميح</span></span>'},
  {el:'#verses .verse', round:18, t:'الكلمة الحمراء وهي صحيحة؟', d:'إذا قلت الكلمة صح والجهاز ما فهمها، اضغطها مرتين لتُحسب صحيحة.'},
  {el:'#hintBtn', t:'تلميح', d:'علقت؟ يظهر لك الكلمة التالية فقط.'},
  {el:'#restartBtn', t:'إعادة', d:'يرجعك لبداية المقطع لتسمّعه من جديد.'},
  {el:'#finishBtn', t:'النتيجة', d:'يعرض نسبتك والكلمات التي أخطأت فيها.'},
  {el:'#kbBtn', t:'كتابة', d:'إذا لم يعمل المايك، اكتب التسميع أو استخدم مايك لوحة المفاتيح.'},
  {el:'#menuBtn', t:'اختيار ما تسمّعه', d:'من هنا تختار الباب، أو من بيت كذا إلى بيت كذا، وعدد الأبيات المعروضة. ويفتح أيضًا بالضغط على اسم الباب.'},
  {el:'#testBtn', t:'اختبار الحفظ', d:'يعطيك مواضع عشوائية كبطاقات، يظهر أول كل موضع وتكمل أنت من حفظك.'},
  {el:'#modeBtn', t:'طريقة العرض', d:'إخفاء الأبيات كاملة، أو إظهار أول كل شطر، أو إظهار كل شيء.'},
  {el:'#fontBtn', t:'حجم الخط', d:'اسحب الشريط لتكبير الخط أو تصغيره.'},
  {el:'#helpBtn', t:'وهذا كل شيء', d:'إذا أردت ترى الشرح مرة ثانية، اضغط علامة الاستفهام هذه.'}
];
let tourI=-1;
const tourEl=$id('tour'), tSpot=$id('tSpot'), tTip=$id('tTip');
function startTour(){
  openSheet(false); openTestSheet(false); $id('fontPop').classList.add('closed');
  $id('tDots').innerHTML=TOUR.map(()=>'<i></i>').join('');
  tourEl.classList.remove('hidden'); tourI=-1; tourGo(0);
}
function endTour(){ tourEl.classList.add('hidden'); tourI=-1; store.set('tourSeen',1); }
function tourGo(i){
  if(i<0) return; if(i>=TOUR.length) return endTour();
  const s=TOUR[i], el=document.querySelector(s.el);
  if(!el){ return tourGo(i>tourI?i+1:i-1); }
  const first=tourI<0; tourI=i;
  if(s.round) el.scrollIntoView({block:'center',behavior:first?'auto':'smooth'});
  tTip.classList.add('swap');
  setTimeout(()=>{
    $id('tTitle').textContent=s.t; $id('tText').innerHTML=s.d;
    $id('tPrev').style.display=i?'':'none';
    $id('tNext').textContent=i===TOUR.length-1?'يلا نبدأ':'التالي';
    $id('tSkip').style.visibility=i===TOUR.length-1?'hidden':'';
    [...$id('tDots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
    tourPlace(); tTip.classList.remove('swap'); $id('tNext').focus({preventScroll:true});
  }, first?0:(s.round?380:200));
}
function tourPlace(){
  if(tourI<0) return;
  const s=TOUR[tourI], el=document.querySelector(s.el); if(!el) return;
  const r=el.getBoundingClientRect(), pad=s.round?6:8;
  let x,y,w,h;
  if(s.round){ x=r.left-pad; y=r.top-pad; w=r.width+2*pad; h=r.height+2*pad; tSpot.style.borderRadius=(s.round+pad)+'px'; }
  else { const d=Math.max(r.width,r.height)+2*pad; x=r.left+r.width/2-d/2; y=r.top+r.height/2-d/2; w=h=d; tSpot.style.borderRadius='50%'; }
  Object.assign(tSpot.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  const tw=tTip.offsetWidth, th=tTip.offsetHeight, vw=innerWidth, vh=innerHeight, gap=16;
  let ty = (y+h+gap+th < vh-8) ? y+h+gap : y-gap-th;
  if(ty<8) ty=Math.max(8, Math.min(vh-th-8, (vh-th)/2));
  let tx=Math.max(12, Math.min(vw-tw-12, x+w/2-tw/2));
  tTip.style.left=tx+'px'; tTip.style.top=ty+'px';
}
$id('tNext').onclick=()=>tourGo(tourI+1);
$id('tPrev').onclick=()=>tourGo(tourI-1);
$id('tSkip').onclick=endTour;
addEventListener('resize',tourPlace); addEventListener('scroll',tourPlace,{passive:true});
document.addEventListener('keydown',e=>{ if(tourI<0) return;
  if(e.key==='Escape') endTour(); else if(e.key==='ArrowLeft') tourGo(tourI+1); else if(e.key==='ArrowRight') tourGo(tourI-1); });
$id('helpBtn').onclick=startTour;

/* ---------- boot ---------- */
fillSections();
markChips(); setMode(mode); setFont(settings.fs || (innerWidth<640?20:26));
setStatus('اضغط المايك وابدأ · أو اضغط على أي بيت لتبدأ منه');
setRange(settings.from||1, settings.to||5, false);
if(!store.get('tourSeen',0)) setTimeout(()=>startTour(),900);
</script>
</body>
</html>
